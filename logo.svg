<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1322"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="ng" cx=".38" cy=".32" r=".85">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="nb" cx=".38" cy=".32" r=".85">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset=".55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#bg)" stroke="#22304a" stroke-width="2"/>

  <!-- stream glow underlay -->
  <g filter="url(#glow)" opacity=".55">
    <path d="M26 62 C42 62 44 50 60 48" stroke="#22d3ee" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M26 36 C44 36 46 46 60 47" stroke="#3b82f6" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- flow streams: two sources merging into the collector -->
  <path d="M26 62 C42 62 44 50 60 48" stroke="url(#fl)" stroke-width="4.5" fill="none" stroke-linecap="round" opacity=".95"/>
  <path d="M26 36 C44 36 46 46 60 47" stroke="url(#fl)" stroke-width="4.5" fill="none" stroke-linecap="round" opacity=".8"/>
  <!-- packet dots riding the streams -->
  <circle cx="44" cy="55.5" r="2.6" fill="#e0f2fe"/>
  <circle cx="50" cy="44.5" r="2.2" fill="#dbeafe" opacity=".9"/>

  <!-- source nodes (ingesters, cyan) -->
  <circle cx="20" cy="36" r="8" fill="url(#ng)"/>
  <circle cx="20" cy="62" r="8" fill="url(#ng)"/>
  <circle cx="20" cy="36" r="8" fill="none" stroke="#67e8f9" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="20" cy="62" r="8" fill="none" stroke="#67e8f9" stroke-opacity=".5" stroke-width="1.5"/>

  <!-- collector node (blue) with ring -->
  <circle cx="68" cy="48" r="13" fill="none" stroke="#3b82f6" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="68" cy="48" r="9.5" fill="url(#nb)"/>
  <circle cx="68" cy="48" r="9.5" fill="none" stroke="#93c5fd" stroke-opacity=".45" stroke-width="1.2"/>
</svg>
