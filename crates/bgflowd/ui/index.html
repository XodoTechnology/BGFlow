<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGFlow</title>
<style>
:root{
  --bg:#0b0e14; --panel:#12161f; --panel2:#171d29; --border:#232b3a;
  --text:#e6edf3; --muted:#8b949e; --accent:#3b82f6; --accent2:#22d3ee;
  --green:#34d399; --red:#f87171; --yellow:#fbbf24;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;height:100vh;display:flex;overflow:hidden}
a{color:var(--accent);text-decoration:none}
#side{width:210px;min-width:210px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 0}
#side .logo{padding:6px 18px 18px;font-size:19px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
#side .logo span{color:var(--accent2)}
#side .logo .lg{flex:none;filter:drop-shadow(0 0 6px rgba(59,130,246,.35))}
#side nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;color:var(--muted);border-left:3px solid transparent;cursor:pointer;font-size:13.5px}
#side nav a:hover{color:var(--text);background:var(--panel2)}
#side nav a.on{color:var(--text);border-left-color:var(--accent);background:var(--panel2)}
#side .foot{margin-top:auto;padding:12px 18px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
#topbar .title{font-size:16px;font-weight:600;margin-right:8px}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:14px;cursor:pointer;font-size:12.5px;user-select:none}
.chip.on{color:var(--text);border-color:var(--accent);background:#1d2b45}
#content{flex:1;overflow-y:auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.card .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.card .val{font-size:24px;font-weight:650;font-family:var(--mono);margin-top:4px}
.card .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12.5px;font-family:var(--mono);min-width:100px}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);border:none;color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.btn.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #1a2030;font-family:var(--mono);font-size:12px;white-space:nowrap}
tr:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.bar{height:6px;border-radius:3px;background:var(--accent);opacity:.75;display:inline-block;vertical-align:middle}
.heat{height:14px;border-radius:3px;display:inline-block;vertical-align:middle;min-width:2px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:#1d2b45;color:var(--accent2);font-family:var(--mono)}
.clickable{color:var(--accent2);cursor:pointer}
.clickable:hover{text-decoration:underline}
canvas{width:100%;height:260px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;font-size:12px;font-family:var(--mono);max-height:400px}
.hint{color:var(--muted);font-size:12px;padding:8px 0}
.err{color:var(--red)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3345;border-radius:5px}
</style>
</head>
<body>
<div id="side">
  <div class="logo"><span class="lg"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="0.5" y="0.5" width="25" height="25" rx="7" fill="#0e1420" stroke="#232b3a"/><circle cx="6.5" cy="8.5" r="2.2" fill="#22d3ee"/><circle cx="6.5" cy="17.5" r="2.2" fill="#22d3ee"/><circle cx="19.5" cy="13" r="2.8" fill="#3b82f6"/><path d="M8.7 8.5 C13 8.5 13.5 13 16.7 13" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity=".85"/><path d="M8.7 17.5 C13 17.5 13.5 13 16.7 13" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity=".85"/></svg></span>BG<span>Flow</span></div>
  <nav id="nav">
    <a data-v="overview" class="on">◈ Overview</a>
    <a data-v="flows">⇄ Flows</a>
    <a data-v="top">▲ Top Talkers</a>
    <a data-v="countries">🌍 Countries</a>
    <a data-v="conv">⬌ Conversations</a>
    <a data-v="anomalies">⚠ Anomalies</a>
    <a data-v="exporters">⬒ Exporters</a>
    <a data-v="labels">⚑ Labels &amp; Enrichment</a>
    <a data-v="metrics">∿ Metrics</a>
  </nav>
  <div class="foot">BGFlow v0.2<br><span id="ver"></span></div>
</div>
<div id="main">
  <div id="topbar">
    <div class="title" id="viewtitle">Overview</div>
    <span class="chip" data-r="-15m">15m</span>
    <span class="chip" data-r="-1h">1h</span>
    <span class="chip" data-r="-6h">6h</span>
    <span class="chip on" data-r="-24h">24h</span>
    <span class="chip" data-r="-7d">7d</span>
    <span class="chip" data-r="custom">custom</span>
    <input id="fromin" placeholder="from (e.g. -1h)" style="display:none;min-width:130px">
    <input id="toin" placeholder="to" style="display:none;min-width:130px">
    <span style="flex:1"></span>
    <span id="ratetick" class="muted" style="font-family:var(--mono);font-size:12px"></span>
    <span id="upd" class="muted" style="font-size:11.5px"></span>
    <select id="refsel" style="background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:6px;font-size:12px">
      <option value="5000">live·5s</option>
      <option value="15000" selected>15s</option>
      <option value="30000">30s</option>
      <option value="60000">1m</option>
      <option value="0">off</option>
    </select>
    <button class="btn ghost" onclick="load()">⟳ Refresh</button>
  </div>
  <div id="content"></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s), content=$('#content');
const state={view:'overview',range:'-24h',refreshMs:15000,metric:'bytes',bucket:'5m',topby:'src_ip',topn:15,granularity:'minute',updated:0,chartSeries:null,hoverI:-1,rate:null};
const F={}; // active filters
let timer=null;

// ---------- helpers ----------
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtB(n){if(n==null)return'-';const u=['B','KiB','MiB','GiB','TiB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return (i? n.toFixed(1):Math.round(n))+' '+u[i]}
function fmtN(n){if(n==null)return'-';return Number(n).toLocaleString()}
function fmtT(ms){const d=new Date(ms);return d.toLocaleTimeString()+ ' '+d.toLocaleDateString()}
function ago(ms){if(!ms)return'-';const s=(Date.now()-ms)/1000;if(s<60)return Math.floor(s)+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
async function api(p){const r=await fetch(p);if(!r.ok)throw new Error(await r.text());return r.json()}
function q(extra={}){const p=new URLSearchParams();const [f,t]=trange();if(f)p.set('from',f);if(t)p.set('to',t);p.set('granularity',state.granularity);for(const[k,v]of Object.entries(F))if(v)p.set(k,v);for(const[k,v]of Object.entries(extra))if(v!=null)p.set(k,v);return p.toString()}
function trange(){if(state.range==='custom'){return[$('#fromin').value||'-24h',$('#toin').value||'now']}return[state.range,null]}
function protoName(p){return({1:'ICMP',6:'TCP',17:'UDP',41:'IPv6',47:'GRE',50:'ESP',58:'ICMPv6'}[p])||('IP'+p)}
// click-to-filter: set an active filter and reload
function setFilter(k,v){F[k]=v;load()}
function clearOne(k){delete F[k];load()}
function activeChips(){const ks=Object.keys(F);if(!ks.length)return'';return `<div class="filters" style="margin-bottom:10px">${ks.map(k=>`<span class="chip on" title="click to remove" onclick="clearOne('${k}')">${k}=${esc(F[k])} ✕</span>`).join('')}<button class="btn ghost" onclick="clearFilters()">Clear all</button></div>`}

// ---------- presets ----------
function presets(){try{return JSON.parse(localStorage.getItem('bgflow_presets')||'{}')}catch(e){return{}}}
function savePresets(p){localStorage.setItem('bgflow_presets',JSON.stringify(p))}
function presetBar(){const p=presets(),names=Object.keys(p);return `<select id="preset_sel" style="min-width:130px"><option value="">presets…</option>${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select>
 <button class="btn ghost" onclick="applyPreset()">Load</button>
 <button class="btn ghost" onclick="savePreset()">Save</button>
 <button class="btn ghost" onclick="delPreset()">Del</button>`}
function applyPreset(){const n=$('#preset_sel')?.value;if(!n)return;const p=presets()[n];if(!p)return;for(const k in F)delete F[k];Object.assign(F,p.f||{});if(p.range)state.range=p.range;load()}
function savePreset(){const n=prompt('Preset name:');if(!n)return;const p=presets();p[n]={f:{...F},range:state.range};savePresets(p)}
function delPreset(){const n=$('#preset_sel')?.value;if(!n||!presets()[n])return;const p=presets();delete p[n];savePresets(p);load()}

// ---------- nav / topbar ----------
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{document.querySelectorAll('#nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');state.view=a.dataset.v;$('#viewtitle').textContent=a.textContent.trim();load()});
document.querySelectorAll('.chip[data-r]').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip[data-r]').forEach(x=>x.classList.remove('on'));c.classList.add('on');state.range=c.dataset.r;const cust=state.range==='custom';$('#fromin').style.display=cust?'':'none';$('#toin').style.display=cust?'':'none';load()});
$('#refsel').onchange=e=>{state.refreshMs=+e.target.value;startAuto()};
function startAuto(){clearInterval(timer);if(state.refreshMs>0)timer=setInterval(()=>{if(state.view!=='metrics')load(true)},state.refreshMs)}
setInterval(()=>{const el=$('#upd');if(el&&state.updated)el.textContent='updated '+Math.floor((Date.now()-state.updated)/1000)+'s ago';
  const rt=$('#ratetick');if(rt&&state.rate)rt.textContent='≈ '+fmtB(state.rate.bps)+'/s · '+fmtN(state.rate.pps)+' pkt/s'},1000);

// ---------- views ----------
async function load(silent){
  if(!silent)content.innerHTML='<div class="hint">Loading…</div>';
  try{
    if(state.view==='overview')await vOverview();
    else if(state.view==='flows')await vFlows();
    else if(state.view==='top')await vTop();
    else if(state.view==='countries')await vCountries();
    else if(state.view==='conv')await vConv();
    else if(state.view==='anomalies')await vAnomalies();
    else if(state.view==='exporters')await vExporters();
    else if(state.view==='labels')await vLabels();
    else if(state.view==='metrics')await vMetrics();
    state.updated=Date.now();
  }catch(e){content.innerHTML='<div class="err">Error: '+esc(e.message)+'</div>'}
}

// click-safe filter: value rides in data-k (esc handles HTML), JS reads it back
function topTbl(items, fk){
  return `<table><tr><th></th><th>Key</th><th class="num">Bytes</th><th class="num">Flows</th></tr>${
    (items||[]).map((t,i)=>`<tr><td class="num muted">${i+1}</td>
      <td class="clickable" data-k="${esc(t.key)}" onclick="setFilter('${fk}',this.dataset.k)">${esc(t.key)}</td>
      <td class="num">${fmtB(t.bytes)}</td><td class="num">${fmtN(t.flows)}</td></tr>`).join('')
    ||'<tr><td colspan=4 class=muted>No data</td></tr>'}</table>`;
}

async function vOverview(){
  const [sum,ts,s,d,sa,da,dp,st]=await Promise.all([
    api('/api/v1/summary?'+q()),api('/api/v1/timeseries?'+q({bucket:state.bucket})),
    api('/api/v1/top?'+q({by:'src_ip',limit:8})),api('/api/v1/top?'+q({by:'dst_ip',limit:8})),
    api('/api/v1/top?'+q({by:'src_asn',limit:8})),api('/api/v1/top?'+q({by:'dst_asn',limit:8})),
    api('/api/v1/top?'+q({by:'dst_port',limit:8})),api('/api/v1/status')]);
  const cards=`<div class="cards">
    <div class="card"><div class="lbl">Flows</div><div class="val">${fmtN(sum.flows)}</div><div class="sub">${esc(trangeLabel())}</div></div>
    <div class="card"><div class="lbl">Bytes</div><div class="val">${fmtB(sum.bytes)}</div><div class="sub">${fmtN(sum.packets)} packets</div></div>
    <div class="card"><div class="lbl">Packets</div><div class="val">${fmtN(sum.packets)}</div><div class="sub">avg ${(sum.packets/Math.max(1,sum.flows)).toFixed(1)}/flow</div></div>
    <div class="card"><div class="lbl">Stored</div><div class="val">${fmtB(st.status.flow_bytes+st.status.rollup_bytes+st.status.hourly_bytes)}</div><div class="sub">${fmtN(st.status.flow_rows+st.status.rollup_rows+st.status.hourly_rows)} rows · ${st.status.uptime_secs}s up</div></div>
  </div>`;
  const protos=(sum.by_protocol||[]).slice(0,6).map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${fmtN(p.flows)}</td><td class="num">${fmtB(p.bytes)}</td><td class="num">${fmtN(p.packets)}</td></tr>`).join('');
  // live rate from the most recent bucket
  const last=ts.series&&ts.series[ts.series.length-1];
  if(last&&ts.bucket_ms){const secs=ts.bucket_ms/1000;state.rate={bps:last.bytes/secs,pps:last.packets/secs}}
  content.innerHTML=filterBar()+activeChips()+cards+
   `<div class="panel"><h3>Traffic — ${esc(state.bucket)}
     <span style="float:right">
       ${['bytes','packets','flows'].map(m=>`<span class="chip ${state.metric===m?'on':''}" data-m="${m}" style="font-size:11px;padding:2px 9px">${m}</span>`).join('')}
       <select id="b_bucket" style="background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:2px 6px;border-radius:5px;font-size:11px">
         ${['1m','5m','15m','1h','6h','1d'].map(b=>`<option value="${b}" ${state.bucket===b?'selected':''}>${b}</option>`).join('')}
       </select></span></h3><canvas id="chart" style="height:280px"></canvas></div>
    <div class="grid2">
      <div class="panel"><h3>Top Sources <span class="muted" style="text-transform:none">(click to filter)</span></h3>${topTbl(s.items,'src')}</div>
      <div class="panel"><h3>Top Destinations</h3>${topTbl(d.items,'dst')}</div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Top Source ASNs</h3>${topTbl(sa.items,'src_asn')}</div>
      <div class="panel"><h3>Top Destination ASNs</h3>${topTbl(da.items,'dst_asn')}</div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>By Protocol</h3><table><tr><th>Proto</th><th class="num">Flows</th><th class="num">Bytes</th><th class="num">Packets</th></tr>${protos||'<tr><td colspan=4 class=muted>No data</td></tr>'}</table></div>
      <div class="panel"><h3>Top Destination Ports</h3>${topTbl(dp.items,'dport')}</div>
    </div>`;
  document.querySelectorAll('[data-m]').forEach(ch=>ch.onclick=()=>{state.metric=ch.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===ch));drawChart(state.chartSeries)});
  const bb=$('#b_bucket');if(bb)bb.onchange=()=>{state.bucket=bb.value;load()};
  drawChart(ts.series||[]);bindChartHover();
}
function trangeLabel(){return state.range==='custom'?($('#fromin').value||'?')+' → '+($('#toin').value||'now'):state.range}

function drawChart(series){
  const c=$('#chart');if(!c||!series||!series.length){state.chartSeries=series;return}
  state.chartSeries=series;
  const metric=state.metric||'bytes';
  const dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const vals=series.map(s=>s[metric]||0);
  const max=Math.max(...vals,1);
  const n=series.length,padL=10,padR=14,padT=16,padB=24,iw=W-padL-padR,ih=H-padT-padB;
  const fmt=metric==='bytes'?fmtB:fmtN;
  // grid + y labels
  x.strokeStyle='#1d2534';x.fillStyle='#8b949e';x.font='10px ui-monospace,monospace';x.lineWidth=1;
  for(let i=0;i<=4;i++){const v=max*i/4,y=padT+ih*(1-i/4);
    x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();
    x.fillText(fmt(v),3,y+3);}
  // x labels
  const step=Math.ceil(n/8);
  series.forEach((s,i)=>{if(i%step)return;const d=new Date(s.t*1000);
    x.fillText(d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),padL+i*iw/Math.max(1,n-1)-16,H-8)});
  // points + catmull-rom → bezier smoothing
  const px=i=>padL+i*iw/Math.max(1,n-1), py=v=>padT+ih-(v/max)*ih;
  const pts=vals.map((v,i)=>[px(i),py(v)]);
  const path=()=>{x.beginPath();
    if(pts.length<3){pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));return}
    x.moveTo(pts[0][0],pts[0][1]);
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
      x.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);
    }};
  // gradient area fill
  const g=x.createLinearGradient(0,padT,0,H-padB);
  g.addColorStop(0,'rgba(59,130,246,.38)');g.addColorStop(.7,'rgba(59,130,246,.08)');g.addColorStop(1,'rgba(59,130,246,0)');
  path();x.lineTo(px(n-1),padT+ih);x.lineTo(px(0),padT+ih);x.closePath();x.fillStyle=g;x.fill();
  // gradient stroke line
  const lg=x.createLinearGradient(padL,0,W-padR,0);lg.addColorStop(0,'#3b82f6');lg.addColorStop(1,'#22d3ee');
  path();x.strokeStyle=lg;x.lineWidth=2;x.lineJoin='round';x.stroke();
  // peak marker
  const mi=vals.indexOf(max);
  x.fillStyle='#e6edf3';x.font='600 11px ui-monospace,monospace';
  x.fillText(fmt(max),px(mi)-14,padT+ih-8);
  // hover crosshair + tooltip
  const hi=state.hoverI;
  if(hi>=0&&hi<n){
    const s=series[hi],hx=px(hi),hy=py(vals[hi]);
    x.strokeStyle='rgba(230,237,243,.35)';x.setLineDash([4,4]);x.lineWidth=1;
    x.beginPath();x.moveTo(hx,padT);x.lineTo(hx,padT+ih);x.stroke();x.setLineDash([]);
    x.beginPath();x.arc(hx,hy,3.5,0,7);x.fillStyle='#22d3ee';x.fill();
    x.strokeStyle='#0b0e14';x.lineWidth=1.5;x.stroke();
    const lbl=`${fmt(vals[hi])} · ${new Date(s.t*1000).toLocaleTimeString()}`;
    x.font='11px ui-monospace,monospace';
    const tw=x.measureText(lbl).width+12;
    let bx=Math.min(Math.max(hx-tw/2,padL),W-padR-tw),by=padT+4;
    x.fillStyle='rgba(18,22,31,.95)';x.strokeStyle='#232b3a';
    if(x.roundRect){x.beginPath();x.roundRect(bx,by,tw,18,5);x.fill();x.stroke()}
    else{x.fillRect(bx,by,tw,18);x.strokeRect(bx,by,tw,18)}
    x.fillStyle='#e6edf3';x.fillText(lbl,bx+6,by+13);
  }
}
function bindChartHover(){
  const c=$('#chart');if(!c)return;
  c.onmousemove=e=>{const s=state.chartSeries;if(!s||!s.length)return;
    const r=c.getBoundingClientRect(),padL=10,padR=14,iw=r.width-padL-padR;
    const i=Math.round((e.clientX-r.left-padL)/iw*(s.length-1));
    i===state.hoverI||(state.hoverI=Math.max(0,Math.min(s.length-1,i)),drawChart(s));};
  c.onmouseleave=()=>{state.hoverI=-1;if(state.chartSeries)drawChart(state.chartSeries)};
}

function filterBar(extra=''){
  return `<div class="filters">
    ${presetBar()}
    <input id="f_src" placeholder="src ip/cidr" value="${esc(F.src||'')}">
    <input id="f_dst" placeholder="dst ip/cidr" value="${esc(F.dst||'')}">
    <select id="f_proto"><option value="">proto</option>${['','tcp','udp','icmp','icmpv6','gre','esp'].map(p=>`<option ${F.proto===p?'selected':''}>${p||'any'}</option>`).join('')}</select>
    <input id="f_sport" placeholder="sport" value="${esc(F.sport||'')}">
    <input id="f_dport" placeholder="dport" value="${esc(F.dport||'')}">
    <input id="f_exporter" placeholder="exporter ip/name(s)" value="${esc(F.exporter||'')}">
    <input id="f_asn" placeholder="asn" value="${esc(F.src_asn||'')}">
    <select id="f_sipv"><option value="">src ipver</option>${['','4','6'].map(v=>`<option value="${v}" ${F.src_ipver===v?'selected':''}>${v?v==='4'?'IPv4':'IPv6':'any'}</option>`).join('')}</select>
    <select id="f_dipv"><option value="">dst ipver</option>${['','4','6'].map(v=>`<option value="${v}" ${F.dst_ipver===v?'selected':''}>${v?v==='4'?'IPv4':'IPv6':'any'}</option>`).join('')}</select>
    <input id="f_label" placeholder="label" value="${esc(F.label||'')}">
    <button class="btn" onclick="applyFilters()">Apply</button>
    <button class="btn ghost" onclick="clearFilters()">Clear</button>${extra}
  </div>`;
}
function readFilters(){F.src=$('#f_src')?.value||'';F.dst=$('#f_dst')?.value||'';F.proto=$('#f_proto')?.value||'';F.sport=$('#f_sport')?.value||'';F.dport=$('#f_dport')?.value||'';F.exporter=$('#f_exporter')?.value||'';const asn=$('#f_asn')?.value||'';F.src_asn=asn;F.dst_asn='';F.src_ipver=$('#f_sipv')?.value||'';F.dst_ipver=$('#f_dipv')?.value||'';F.label=$('#f_label')?.value||'';for(const k in F)if(!F[k])delete F[k]}
function applyFilters(){readFilters();load()}
function clearFilters(){for(const k in F)delete F[k];load()}

// map a top-dim name to the filter param + value for click-to-filter
const DIM2F={src_ip:'src',dst_ip:'dst',src_asn:'src_asn',dst_asn:'dst_asn',src_port:'sport',dst_port:'dport',proto:'proto',exporter:'exporter',src_country:'src_country',dst_country:'dst_country',label:'label',src_ipver:'src_ipver',dst_ipver:'dst_ipver',src_org:'src_org',dst_org:'dst_org'};
function clickDim(by,key){const f=DIM2F[by];if(!f)return;F[f]=key;load()}
// raw key for filtering when formatted key is a display string
function clickDimRaw(by,keyRaw,fmtKey){const f=DIM2F[by];if(!f)return;
  // key_raw is a string (u128-safe); use fmtKey where semantics matter
  if(by==='src_ipver'||by==='dst_ipver'){F[f]=fmtKey==='IPv6'?'6':'4'}
  else if(by==='label'){F[f]=fmtKey} // label name preferred
  else if(by==='src_org'||by==='dst_org'){F[f]=keyRaw} // numeric org id as string — API parses u32
  else{F[f]=fmtKey}
  load()}

const TOP_DIMS=['src_ip','dst_ip','src_ipver','dst_ipver','src_asn','dst_asn','src_org','dst_org','src_port','dst_port','proto','exporter','src_country','dst_country','label'];

async function vFlows(){
  content.innerHTML=filterBar(`<select id="f_limit"><option>100</option><option selected>500</option><option>2000</option><option>10000</option></select>
   <button class="btn ghost" onclick="dlCsv()">CSV</button>`)+
   '<div class="panel"><h3>Raw Flows (newest first)</h3><div id="tbl"></div></div>';
  const lim=$('#f_limit')?.value||500;
  const data=await api('/api/v1/flows?'+q({limit:lim}));
  const rows=(data.flows||[]).map(f=>`<tr>
    <td class="muted">${f.ts?new Date(f.ts*1000).toLocaleTimeString():'-'}</td>
    <td><span class="clickable" onclick="setFilter('src','${esc(f.src_ip)}')">${esc(f.src_ip)}</span><span class="muted">:${f.src_port}</span></td>
    <td><span class="clickable" onclick="setFilter('dst','${esc(f.dst_ip)}')">${esc(f.dst_ip)}</span><span class="muted">:${f.dst_port}</span></td>
    <td><span class="tag">${esc(f.protocol_name||protoName(f.protocol))}</span></td>
    <td class="num">${fmtB(f.bytes)}</td><td class="num">${fmtN(f.packets)}</td>
    <td class="muted">AS${f.src_asn||'-'} → AS${f.dst_asn||'-'}</td>
    <td>${esc(f.src_org||f.src_country||'')} → ${esc(f.dst_org||f.dst_country||'')}</td>
    <td>${f.label?`<span class="tag clickable" onclick="setFilter('label','${esc(f.label)}')">${esc(f.label)}</span>`:'<span class="muted">-</span>'}</td>
    <td class="muted clickable" onclick="setFilter('exporter','${esc(f.exporter)}')" title="${esc(f.exporter)}">${esc(expLabel(f.exporter))}</td></tr>`).join('');
  $('#tbl').innerHTML=`<table><tr><th>Time</th><th>Source</th><th>Dest</th><th>Proto</th><th class="num">Bytes</th><th class="num">Pkts</th><th>ASN</th><th>Org/Country</th><th>Label</th><th>Exporter</th></tr>${rows||'<tr><td colspan=10 class=muted>No flows</td></tr>'}</table>
   <div class="hint">${data.count} flows · <a href="#" onclick="dlCsv();return false">download CSV</a></div>`;
}
async function dlCsv(){const r=await fetch('/api/v1/flows?'+q({limit:10000,format:'csv'}));const d=await r.json();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d.csv],{type:'text/csv'}));a.download='bgflow-flows.csv';a.click()}

async function vTop(){
  content.innerHTML=`<div class="filters" id="dimchips">
    ${presetBar()}
    ${TOP_DIMS.map(d=>`<span class="chip ${state.topby===d?'on':''}" data-d="${d}">${d}</span>`).join('')}
    <select id="t_n"><option>10</option><option selected>15</option><option>25</option><option>50</option></select>
    <select id="t_gran"><option value="minute" ${state.granularity==='minute'?'selected':''}>minute</option><option value="hourly" ${state.granularity==='hourly'?'selected':''}>hourly</option></select>
    <button class="btn" onclick="load()">Apply</button></div>
   <div class="panel"><h3>Top <span id="t_lbl"></span> <span class="muted" style="text-transform:none">(click a key to filter)</span></h3><div id="tbl"></div></div>`;
  document.querySelectorAll('#dimchips .chip[data-d]').forEach(c=>c.onclick=()=>{
    state.topby=c.dataset.d;
    document.querySelectorAll('#dimchips .chip[data-d]').forEach(x=>x.classList.toggle('on',x===c));
    loadTopData();
  });
  state.topn=+$('#t_n').value;state.granularity=$('#t_gran').value;
  await loadTopData();
}
async function loadTopData(){
  $('#t_lbl').textContent=state.topby;
  const data=await api('/api/v1/top?'+q({by:state.topby,limit:state.topn}));
  const max=data.items?.[0]?.bytes||1;
  const rows=(data.items||[]).map((t,i)=>`<tr><td class="num muted">${i+1}</td>
    <td class="clickable" onclick='clickDimRaw(${JSON.stringify(state.topby)},${t.key_raw},${JSON.stringify(typeof t.key==='object'?JSON.stringify(t.key):String(t.key))})'>${esc(typeof t.key==='object'?JSON.stringify(t.key):t.key)}</td>
    <td style="width:30%"><span class="bar" style="width:${Math.max(2,t.bytes/max*100)}%"></span></td>
    <td class="num">${fmtB(t.bytes)}</td><td class="num">${fmtN(t.packets)}</td><td class="num">${fmtN(t.flows)}</td></tr>`).join('');
  $('#tbl').innerHTML=`<table><tr><th></th><th>Key</th><th></th><th class="num">Bytes</th><th class="num">Packets</th><th class="num">Flows</th></tr>${rows||'<tr><td colspan=6 class=muted>No data</td></tr>'}</table>
   <div class="hint">dataset: ${esc(data.set||'minute')}</div>`;
}

async function vCountries(){
  content.innerHTML=`<div class="filters">
    ${presetBar()}
    <select id="c_side"><option value="src_country">source</option><option value="dst_country">destination</option></select>
    <select id="c_n"><option>10</option><option selected>20</option><option>50</option></select>
    <select id="c_gran"><option value="minute">minute</option><option value="hourly">hourly</option></select>
    <button class="btn" onclick="load()">Apply</button></div>
   <div class="panel"><h3>Top Countries <span class="muted" style="text-transform:none">(heat = share of peak)</span></h3><div id="tbl"></div></div>`;
  const by=$('#c_side').value,n=+$('#c_n').value;state.granularity=$('#c_gran').value;
  const [a,b]=await Promise.all([
    api('/api/v1/top?'+q({by:'src_country',limit:n})),
    api('/api/v1/top?'+q({by:'dst_country',limit:n}))]);
  const max=Math.max(...(a.items||[]).map(t=>t.bytes),...(b.items||[]).map(t=>t.bytes),1);
  const row=(t,side)=>{const pct=t.bytes/max*100;return `<tr><td><span class="clickable" onclick="setFilter('${side}','${esc(t.key)}')">${esc(t.key)}</span></td>
    <td style="width:40%"><span class="heat" style="width:${Math.max(2,pct)}%;background:linear-gradient(90deg,#1d4ed8,#22d3ee)"></span></td>
    <td class="num">${fmtB(t.bytes)}</td><td class="num">${fmtN(t.flows)}</td></tr>`};
  const ta=(a.items||[]).map(t=>row(t,'src_country')).join(''),tb=(b.items||[]).map(t=>row(t,'dst_country')).join('');
  $('#tbl').innerHTML=`<div class="grid2"><div><h3 class="muted" style="font-size:12px;margin-bottom:6px">SOURCE</h3><table><tr><th>Country</th><th></th><th class="num">Bytes</th><th class="num">Flows</th></tr>${ta||'<tr><td colspan=4 class=muted>No data</td></tr>'}</table></div>
  <div><h3 class="muted" style="font-size:12px;margin-bottom:6px">DESTINATION</h3><table><tr><th>Country</th><th></th><th class="num">Bytes</th><th class="num">Flows</th></tr>${tb||'<tr><td colspan=4 class=muted>No data</td></tr>'}</table></div></div>`;
}

async function vConv(){
  content.innerHTML=filterBar('<span class="hint" style="margin:0">click IPs to filter</span>')+'<div class="panel"><h3>Top Conversations</h3><div id="tbl"></div></div>';
  readFilters();
  const data=await api('/api/v1/conversations?'+q({limit:50}));
  const rows=(data.items||[]).map(c=>`<tr>
    <td><span class="clickable" onclick="setFilter('src','${esc(c.src_ip)}')">${esc(c.src_ip)}</span><span class="muted">:${c.src_port}</span></td>
    <td><span class="clickable" onclick="setFilter('dst','${esc(c.dst_ip)}')">${esc(c.dst_ip)}</span><span class="muted">:${c.dst_port}</span></td>
    <td><span class="tag">${esc(c.protocol_name)}</span></td>
    <td class="num">${fmtB(c.bytes)}</td><td class="num">${fmtN(c.packets)}</td><td class="num">${fmtN(c.flows)}</td></tr>`).join('');
  $('#tbl').innerHTML=`<table><tr><th>Source</th><th>Destination</th><th>Proto</th><th class="num">Bytes</th><th class="num">Packets</th><th class="num">Flows</th></tr>${rows||'<tr><td colspan=6 class=muted>No data</td></tr>'}</table>`;
}

async function vAnomalies(){
  content.innerHTML=`<div class="filters">
    ${presetBar()}
    <select id="a_by">${TOP_DIMS.map(d=>`<option value="${d}" ${state.topby===d?'selected':''}>${d}</option>`).join('')}</select>
    <input id="a_sigma" placeholder="sigma (3)" value="3" style="width:80px">
    <select id="a_gran"><option value="minute">minute</option><option value="hourly">hourly</option></select>
    <button class="btn" onclick="load()">Scan</button></div>
   <div class="panel"><h3>Anomalies <span class="muted" style="text-transform:none">(z-score vs window baseline; needs ≥3 buckets)</span></h3><div id="tbl"></div></div>`;
  const by=$('#a_by').value,sig=$('#a_sigma').value||3;state.granularity=$('#a_gran').value;
  const data=await api('/api/v1/anomalies?'+q({by,sigma:sig,limit:50}));
  const maxZ=(data.items||[])[0]?.zscore||1;
  const rows=(data.items||[]).map(a=>`<tr><td class="muted">${fmtT(a.t*1000)}</td>
    <td class="clickable" onclick='clickDimRaw(${JSON.stringify(by)},${a.key_raw},${JSON.stringify(String(a.key))})'>${esc(a.key)}</td>
    <td><span class="heat" style="width:${Math.min(100,a.zscore/maxZ*100)}%;background:linear-gradient(90deg,#fbbf24,#f87171)"></span></td>
    <td class="num">${a.zscore}σ</td><td class="num">${fmtB(a.bytes)}</td></tr>`).join('');
  $('#tbl').innerHTML=`<table><tr><th>Time</th><th>Key</th><th></th><th class="num">Z</th><th class="num">Bytes</th></tr>${rows||'<tr><td colspan=5 class=muted>No anomalies — widen the range or lower sigma</td></tr>'}</table>`;
}

let expNames={};
async function loadExpNames(){try{const d=await api('/api/v1/exporters');expNames={};(d.items||[]).forEach(e=>{if(e.name)expNames[e.ip]=e.name})}catch(e){}}
function expLabel(ip){return expNames[ip]?`${expNames[ip]} (${ip})`:ip}

async function vExporters(){
  const [ex,st]=await Promise.all([api('/api/v1/exporters'),api('/api/v1/status')]);
  loadExpNames();
  const rows=(ex.items||[]).map(e=>`<tr><td class="clickable" onclick="setFilter('exporter','${esc(e.ip)}')">${e.name?`<b>${esc(e.name)}</b> <span class="muted">${esc(e.ip)}</span>`:esc(e.ip)}</td><td class="num">${fmtN(e.datagrams)}</td><td class="num">${fmtN(e.records)}</td><td class="num">${fmtB(e.bytes_in)}</td><td class="muted">${ago(e.last_seen_ms)}</td></tr>`).join('');
  content.innerHTML=filterBar()+`<div class="cards">
    <div class="card"><div class="lbl">Exporters</div><div class="val">${(ex.items||[]).length}</div></div>
    <div class="card"><div class="lbl">Uptime</div><div class="val">${Math.floor(st.status.uptime_secs/60)}m</div></div>
    <div class="card"><div class="lbl">Flow segments</div><div class="val">${st.status.flow_segments}</div><div class="sub">${fmtB(st.status.flow_bytes)}</div></div>
    <div class="card"><div class="lbl">Rollup + hourly</div><div class="val">${st.status.rollup_segments}+${st.status.hourly_segments}</div><div class="sub">${fmtB(st.status.rollup_bytes+st.status.hourly_bytes)}</div></div></div>
   <div class="panel"><h3>Exporters <span class="muted" style="text-transform:none">(click to filter all views)</span></h3><table><tr><th>IP</th><th class="num">Datagrams</th><th class="num">Records</th><th class="num">Bytes in</th><th>Last seen</th></tr>${rows||'<tr><td colspan=5 class=muted>No exporters seen yet</td></tr>'}</table></div>`;
  readFilters();
}

async function vLabels(){
  const [lb,en,ls,st]=await Promise.all([api('/api/v1/labels'),api('/api/v1/enrichers'),api('/api/v1/label_stats'),api('/api/v1/status')]);
  const rules=(lb.items||[]).map(r=>`<tr><td class="num">${r.id}</td><td><span class="tag clickable" onclick="setFilter('label','${esc(r.name)}')">${esc(r.name)}</span></td></tr>`).join('');
  const backends=(en.backends||[]).map(b=>`<tr><td>${esc(b.name)}</td><td class="muted">${esc(b.type||'http')} ${esc(b.url||'')}</td><td class="num">${b.cache_entries??'-'}</td><td class="num">${b.pending??'-'}</td></tr>`).join('');
  const tables=(en.tables||[]).map(t=>`<tr><td>${esc(t.name)}</td><td class="muted">table</td><td class="num">${t.stats?.prefixes??'-'}</td><td class="muted">${ago(t.stats?.loaded_ms)}</td></tr>`).join('');
  const lstats=(ls.items||[]).map(l=>`<tr><td>${l.label&&l.label!==0?`<span class="tag clickable" onclick="setFilter('label','${esc(l.label)}')">${esc(l.label)}</span>`:`<span class="tag">${esc(l.label===0?'(unlabeled)':l.label)}</span>`}</td><td class="num">${fmtN(l.flows)}</td><td class="num">${fmtB(l.bytes)}</td><td class="num">${fmtN(l.packets)}</td></tr>`).join('');
  content.innerHTML=activeChips()+`<div class="grid2">
   <div class="panel"><h3>Label Rules (${(lb.items||[]).length})</h3><table><tr><th>ID</th><th>Label</th></tr>${rules||'<tr><td colspan=2 class=muted>No rules configured — add [[rules]] to bgflow.toml</td></tr>'}</table></div>
   <div class="panel"><h3>Enrichers</h3><table><tr><th>Name</th><th>Type</th><th class="num">Entries</th><th>Last load</th></tr>${backends}${tables||'<tr><td colspan=4 class=muted>No enrichers configured</td></tr>'}</table>
     <div class="hint">HTTP: <code>[[enrichers]] type="http" url="https://irrd3.net/api/lookup?ip={ip}"</code> · Table: <code>type="table" path="/path/to/prefixes.txt"</code> (lines: <code>1.2.3.0/24 13335 OrgName US</code>)</div></div></div>
   <div class="grid2">
   <div class="panel"><h3>Traffic by Label</h3><table><tr><th>Label</th><th class="num">Flows</th><th class="num">Bytes</th><th class="num">Packets</th></tr>${lstats||'<tr><td colspan=4 class=muted>No data</td></tr>'}</table></div>
   <div class="panel"><h3>Enrichment Lookup</h3>
     <div class="filters"><input id="lu_ip" placeholder="IP address"><button class="btn" onclick="doLookup()">Lookup</button></div>
     <pre id="lu_out">Cached enrichment detail for an IP (backend results).</pre></div></div>
   <div class="panel"><h3>Storage</h3><pre>${esc(JSON.stringify(st.status,null,2))}</pre></div>`;
}
async function doLookup(){const ip=$('#lu_ip').value.trim();if(!ip)return;try{const d=await api('/api/v1/lookup?ip='+encodeURIComponent(ip));$('#lu_out').textContent=JSON.stringify(d,null,2)}catch(e){$('#lu_out').textContent='Error: '+e.message}}

async function vMetrics(){
  const r=await fetch('/metrics');const t=await r.text();
  content.innerHTML=`<div class="panel"><h3>Prometheus Metrics</h3><pre>${esc(t)}</pre></div>`;
}

fetch('/api/v1/status').then(r=>r.json()).then(d=>{$('#ver').textContent='uptime '+Math.floor(d.status.uptime_secs/60)+'m'}).catch(()=>{});
loadExpNames();startAuto();load();
</script>
