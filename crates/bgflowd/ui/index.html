<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGFlow</title>
<style>
:root{
  --bg:#0b0e14; --panel:#12161f; --panel2:#171d29; --border:#232b3a;
  --text:#e6edf3; --muted:#8b949e; --accent:#3b82f6; --accent2:#22d3ee;
  --green:#34d399; --red:#f87171; --yellow:#fbbf24; --pink:#e879f9;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
[data-theme=light]{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f6; --border:#d8dee7;
  --text:#1c2330; --muted:#5d6b7f; --accent:#2563eb; --accent2:#0891b2;
  --green:#059669; --red:#dc2626; --yellow:#d97706; --pink:#a21caf;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;height:100vh;display:flex;overflow:hidden}
a{color:var(--accent);text-decoration:none}
#side{width:210px;min-width:210px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 0}
#side .logo{padding:6px 18px 18px;font-size:19px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
#side .logo span{color:var(--accent2)}
#side .logo .lg{flex:none;filter:drop-shadow(0 0 6px rgba(59,130,246,.35))}
#side nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;color:var(--muted);border-left:3px solid transparent;cursor:pointer;font-size:13.5px}
#side nav a:hover{color:var(--text);background:var(--panel2)}
#side nav a.on{color:var(--text);border-left-color:var(--accent);background:var(--panel2)}
#side .foot{margin-top:auto;padding:12px 18px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
#topbar .title{font-size:16px;font-weight:600;margin-right:8px}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:14px;cursor:pointer;font-size:12.5px;user-select:none}
.chip.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel2))}
#content{flex:1;overflow-y:auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.card .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.card .val{font-size:24px;font-weight:650;font-family:var(--mono);margin-top:4px}
.card .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12.5px;font-family:var(--mono);min-width:100px}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);border:none;color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.btn.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);font-family:var(--mono);font-size:12px;white-space:nowrap}
tr:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.bar{height:6px;border-radius:3px;background:var(--accent);opacity:.75;display:inline-block;vertical-align:middle}
.heat{height:14px;border-radius:3px;display:inline-block;vertical-align:middle;min-width:2px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:color-mix(in srgb,var(--accent2) 14%,var(--panel2));color:var(--accent2);font-family:var(--mono)}
.pbadge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;font-family:var(--mono);color:var(--pc);border:1px solid var(--pc);background:rgba(255,255,255,.03);min-width:34px;text-align:center}
.vbadge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10.5px;font-weight:700;font-family:var(--mono);background:color-mix(in srgb,var(--accent2) 14%,var(--panel2));color:var(--accent2)}
.vbadge.v6{background:color-mix(in srgb,#e879f9 16%,var(--panel2));color:var(--pink)}
.flg{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:15px;letter-spacing:0}
.clickable{color:var(--accent2);cursor:pointer}
.clickable:hover{text-decoration:underline}
canvas{width:100%;height:260px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;font-size:12px;font-family:var(--mono);max-height:400px}
.hint{color:var(--muted);font-size:12px;padding:8px 0}
.err{color:var(--red)}
#toast{position:fixed;right:18px;bottom:18px;background:#3a1520;border:1px solid var(--red);color:#fecaca;padding:10px 16px;border-radius:8px;font-size:12.5px;max-width:440px;z-index:99;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:auto;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:none}
#fdetail{position:fixed;right:0;top:0;bottom:0;width:340px;background:var(--panel,#16181d);border-left:1px solid var(--border,#2a2d34);padding:14px 16px;overflow-y:auto;z-index:98;font-size:12.5px;box-shadow:-6px 0 24px rgba(0,0,0,.4)}
#fdetail .fd-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:8px}
#fdetail table{width:100%;border-collapse:collapse}
#fdetail td{padding:3px 4px;border-bottom:1px solid var(--border,#22242a);vertical-align:top;word-break:break-all}
#iptip{position:fixed;z-index:97;display:none;background:var(--panel,#16181d);border:1px solid var(--border,#2a2d34);border-radius:8px;padding:8px 12px;font-size:12px;max-width:320px;box-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:none}
#iptip .ipt-ip{font-weight:700;margin-bottom:2px}
#iptip .ipt-sub{color:var(--muted);font-size:11px}
#iptip .ipt-org{color:var(--muted)}
#login{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,#16233c 0%,var(--bg) 60%);display:flex;align-items:center;justify-content:center;z-index:100}
#login .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:34px 34px 26px;width:350px;box-shadow:0 18px 60px rgba(0,0,0,.55)}
#login .logo{justify-content:center;margin-bottom:4px}
#login input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:8px;font-size:14px;margin:7px 0 4px;font-family:inherit}
#login input:focus{outline:none;border-color:var(--accent)}
#login .err{color:var(--red);font-size:12.5px;min-height:20px;margin:4px 0 10px}
.userbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-left:auto}
.rolebadge{padding:1px 9px;border-radius:10px;font-size:10.5px;font-weight:700;letter-spacing:.4px;background:color-mix(in srgb,var(--accent2) 14%,var(--panel2));color:var(--accent2);text-transform:uppercase}
.rolebadge.admin{background:color-mix(in srgb,#e879f9 16%,var(--panel2));color:var(--pink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
</style>
</head>
<body>
<div id="side">
  <div class="logo"><span class="lg"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="0.5" y="0.5" width="25" height="25" rx="7" fill="#0e1420" stroke="#232b3a"/><circle cx="6.5" cy="8.5" r="2.2" fill="#22d3ee"/><circle cx="6.5" cy="17.5" r="2.2" fill="#22d3ee"/><circle cx="19.5" cy="13" r="2.8" fill="#3b82f6"/><path d="M8.7 8.5 C13 8.5 13.5 13 16.7 13" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity=".85"/><path d="M8.7 17.5 C13 17.5 13.5 13 16.7 13" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity=".85"/></svg></span>BG<span>Flow</span></div>
  <nav id="nav">
    <a data-v="overview" class="on">◈ Overview</a>
    <a data-v="flows">⇄ Flows</a>
    <a data-v="top">▲ Top Talkers</a>
    <a data-v="countries">🌍 Countries</a>
    <a data-v="conv">⬌ Conversations</a>
    <a data-v="flowmap">≋ Flow Map</a>
    <a data-v="geo">◎ Geo</a>
    <a data-v="anomalies">⚠ Anomalies</a>
    <a data-v="exporters">⬒ Exporters</a>
    <a data-v="labels">⚑ Labels &amp; Enrichment</a>
    <a data-v="metrics">∿ Metrics</a>
  </nav>
  <div class="foot">BGFlow<br><span id="ver"></span></div>
</div>
<div id="main">
  <div id="topbar">
    <div class="title" id="viewtitle">Overview</div>
    <span class="chip" data-r="-15m">15m</span>
    <span class="chip" data-r="-1h">1h</span>
    <span class="chip" data-r="-6h">6h</span>
    <span class="chip on" data-r="-24h">24h</span>
    <span class="chip" data-r="-7d">7d</span>
    <span class="chip" data-r="custom">custom</span>
    <input id="fromin" placeholder="from (e.g. -1h)" style="display:none;min-width:130px">
    <input id="toin" placeholder="to" style="display:none;min-width:130px">
    <span style="flex:1"></span>
    <span class="chip" id="syschip" style="cursor:default;font-family:var(--mono);font-size:11.5px" title="host resources">…</span>
    <span class="userbox" id="userbox" style="display:none;margin-left:0">
      <span class="rolebadge" id="rolebadge"></span><span id="uname"></span>
      <button class="btn ghost" id="btnreload" style="display:none;padding:4px 10px;font-size:11.5px" title="Hot-reload config (admin)">⟳ cfg</button>
      <button class="btn ghost" style="padding:4px 10px;font-size:11.5px" onclick="doLogout()">Logout</button>
    </span>
    <span id="ratetick" class="muted" style="font-family:var(--mono);font-size:12px"></span>
    <span id="upd" class="muted" style="font-size:11.5px"></span>
    <select id="refsel" style="background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:6px;font-size:12px">
      <option value="5000">live·5s</option>
      <option value="15000" selected>15s</option>
      <option value="30000">30s</option>
      <option value="60000">1m</option>
      <option value="0">off</option>
    </select>
    <button class="btn ghost" id="themebtn" title="Toggle light/dark theme" style="padding:4px 10px;font-size:13px">◐</button>
    <button class="btn ghost" onclick="load()">⟳ Refresh</button>
  </div>
  <div id="content"></div>
</div>
<div id="login" style="display:none">
  <div class="card">
    <div class="logo"><span class="lg"><svg width="30" height="30" viewBox="0 0 26 26"><rect x="0.5" y="0.5" width="25" height="25" rx="7" fill="#0e1420" stroke="#232b3a"/><circle cx="6.5" cy="8.5" r="2.2" fill="#22d3ee"/><circle cx="6.5" cy="17.5" r="2.2" fill="#22d3ee"/><circle cx="19.5" cy="13" r="2.8" fill="#3b82f6"/><path d="M8.7 8.5 C13 8.5 13.5 13 16.7 13" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity=".85"/><path d="M8.7 17.5 C13 17.5 13.5 13 16.7 13" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity=".85"/></svg></span>BG<span>Flow</span></div>
    <div class="muted" style="text-align:center;font-size:12.5px;margin:2px 0 16px">Sign in to continue</div>
    <input id="lu" placeholder="Username" autocomplete="username">
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Sign in</button>
  </div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s), content=$('#content');
const state={view:'overview',range:'-24h',refreshMs:15000,metric:'bytes',bucket:'5m',topby:'src_ip',topn:15,granularity:'minute',updated:0,chartSeries:null,hoverI:-1,rate:null,msrc:'src_country',mdst:'dst_country',mlim:100,mapData:null,mapHover:-1,mapHoverNode:null};
const F={}; // active filters

// ---------- theme ----------
(function(){const t=localStorage.getItem('bgflow_theme');if(t)document.documentElement.dataset.theme=t})();
$('#themebtn')?.addEventListener('click',()=>{
  const cur=document.documentElement.dataset.theme==='light'?'':'light';
  if(cur)document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;
  localStorage.setItem('bgflow_theme',cur);
  $('#themebtn').textContent=cur?'☀':'◐';
});
if(document.documentElement.dataset.theme==='light')$('#themebtn').textContent='☀';

// ---------- shareable URL state ----------
// Encode view/range/metric/bucket/dims/filters into location.hash so a
// copied URL restores the exact dashboard state.
function syncHash(){
  const p=new URLSearchParams();
  p.set('v',state.view);p.set('r',state.range);p.set('b',state.bucket);
  p.set('m',state.metric);p.set('by',state.topby);p.set('n',state.topn);p.set('g',state.granularity);
  if(state.range==='custom'){const[f,t]=trange();if(f)p.set('from',f);if(t)p.set('to',t)}
  for(const[k,v]of Object.entries(F))p.set('f.'+k,v);
  const h='#'+p.toString();
  if(location.hash!==h)history.replaceState(null,'',h);
}
function loadHash(){
  const h=location.hash.slice(1);if(!h)return;
  let p;try{p=new URLSearchParams(h)}catch(e){return}
  const v=p.get('v');
  if(v&&[...document.querySelectorAll('#nav a')].some(a=>a.dataset.v===v)){
    state.view=v;
    document.querySelectorAll('#nav a').forEach(x=>{x.classList.toggle('on',x.dataset.v===v)});
    const t=document.querySelector('#nav a[data-v="'+v+'"]');if(t)$('#viewtitle').textContent=t.textContent.trim();
  }
  const r=p.get('r');
  if(r){state.range=r;
    document.querySelectorAll('.chip[data-r]').forEach(x=>x.classList.toggle('on',x.dataset.r===r));
    const cust=r==='custom';$('#fromin').style.display=cust?'':'none';$('#toin').style.display=cust?'':'none';
    if(cust){if(p.get('from'))$('#fromin').value=p.get('from');if(p.get('to'))$('#toin').value=p.get('to')}
  }
  if(p.get('b'))state.bucket=p.get('b');
  if(p.get('m'))state.metric=p.get('m');
  if(p.get('by'))state.topby=p.get('by');
  if(p.get('n'))state.topn=+p.get('n')||15;
  if(p.get('g'))state.granularity=p.get('g');
  for(const[k,val]of p.entries())if(k.startsWith('f.')&&val)F[k.slice(2)]=val;
}
loadHash();
let timer=null;

// ---------- helpers ----------
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtB(n){if(n==null)return'-';const u=['B','KiB','MiB','GiB','TiB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return (i? n.toFixed(1):Math.round(n))+' '+u[i]}
function fmtN(n){if(n==null)return'-';return Number(n).toLocaleString()}
function fmtT(ms){const d=new Date(ms);return d.toLocaleTimeString()+ ' '+d.toLocaleDateString()}
function ago(ms){if(!ms)return'-';const s=(Date.now()-ms)/1000;if(s<60)return Math.floor(s)+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
const API_TIMEOUT=20000;
let ME=null; // {user,role,auth} or {open:true}
function showLogin(){$('#login').style.display='flex';setTimeout(()=>$('#lu')?.focus(),50)}
async function api(p,opt){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),API_TIMEOUT);
  const headers={};let body;
  if(opt&&opt.body!=null){headers['Content-Type']='application/json';body=JSON.stringify(opt.body)}
  let r;
  try{r=await fetch(p,{method:(opt&&opt.method)||'GET',headers,body,signal:ctl.signal})}
  catch(e){clearTimeout(to);throw new Error(e.name==='AbortError'?'request timed out ('+API_TIMEOUT/1000+'s)':e.message)}
  clearTimeout(to);
  if(r.status===401&&ME&&!ME.open){showLogin();throw new Error('authentication required')}
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function probeAuth(){
  try{
    const r=await fetch('/api/v1/auth/me',{signal:AbortSignal.timeout(8000)});
    const d=await r.json();
    if(d.auth){ME=d;showUser();loadExpNames();loadIfNames();loadVlanNames();startAuto();load()}
    else if(d.open){ME={open:true};loadExpNames();loadIfNames();loadVlanNames();startAuto();load()}
    else showLogin();
  }catch(e){showLogin()}
}
function showUser(){
  $('#userbox').style.display='flex';
  $('#uname').textContent=ME.user||'';
  const rb=$('#rolebadge');rb.textContent=ME.role||'';rb.className='rolebadge'+(ME.role==='admin'?' admin':'');
  if(ME.role==='admin')$('#btnreload').style.display='';
}
async function doLogin(){
  const u=$('#lu').value.trim(),p=$('#lp').value,lerr=$('#lerr');
  lerr.textContent='';
  try{
    const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p}),signal:AbortSignal.timeout(15000)});
    if(!r.ok){const d=await r.json().catch(()=>({}));lerr.textContent=d.error||('login failed ('+r.status+')');return}
    const d=await r.json();ME=d;$('#login').style.display='none';showUser();loadExpNames();loadIfNames();loadVlanNames();startAuto();load();
  }catch(e){lerr.textContent='request failed: '+e.message}
}
async function doLogout(){
  try{await fetch('/api/v1/auth/logout',{method:'POST',signal:AbortSignal.timeout(8000)})}catch(e){}
  location.reload();
}
async function doReload(){
  try{
    const r=await fetch('/api/v1/admin/reload',{method:'POST',signal:AbortSignal.timeout(20000)});
    const d=await r.json();
    toast(d.ok?('Config reloaded: '+d.rules+' rules, '+d.enrichers+' enrichers, '+d.users+' users, '+d.alert_rules+' alerts')
             :('Reload errors: '+(d.errors||[]).join('; ')),d.ok?5000:9000);
  }catch(e){toast('Reload failed: '+e.message)}
}
$('#lp')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#lu')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('#lp').focus()});
$('#btnreload')?.addEventListener('click',doReload);
function toast(msg,ms=9000){
  let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);
    t.onclick=()=>t.classList.remove('show')}
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms);
}
function q(extra={}){const p=new URLSearchParams();const [f,t]=trange();if(f)p.set('from',f);if(t)p.set('to',t);p.set('granularity',state.granularity);for(const[k,v]of Object.entries(F))if(v)p.set(k,v);for(const[k,v]of Object.entries(extra))if(v!=null)p.set(k,v);return p.toString()}
function trange(){if(state.range==='custom'){return[$('#fromin').value||'-24h',$('#toin').value||'now']}return[state.range,null]}
function protoName(p){return({1:'ICMP',6:'TCP',17:'UDP',41:'IPv6',47:'GRE',50:'ESP',58:'ICMPv6'}[p])||('IP'+p)}
// country flag emoji from ISO code (plain text — canvas-safe); '' for non-codes
function flag(cc){if(!/^[A-Za-z]{2}$/.test(cc||''))return'';return String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65))+' '}
const PCOL={TCP:'#3b82f6',UDP:'#22c55e',ICMP:'#f59e0b','ICMPv6':'#f59e0b',GRE:'#a855f7',ESP:'#ef4444'};
function protoBadge(n){return `<span class="pbadge" style="--pc:${PCOL[n]||'#64748b'}">${esc(n)}</span>`}
// dim-aware key rendering: flags, proto badges, ipver/asn styling
// org name or country code → flag when it's a 2-letter country code
function ocCell(v){v=v||'';return /^[A-Z]{2}$/.test(v)?countryHtml(v):esc(v)}
function dimLabel(dim,key){
  const k=typeof key==='object'?JSON.stringify(key):String(key??'');
  if(dim.includes('country'))return countryHtml(k);
  if(dim==='proto')return protoBadge(k);

let loadBusy=false,loadNext=null;
async function load(silent){
  // Serialize loads: while one is in flight, further requests coalesce
  // into a single follow-up run. Without this, a slow fetch resolving
  // after the user navigated writes into DOM elements that no longer
  // exist (null.textContent crashes).
  if(loadBusy){loadNext={silent:(loadNext?loadNext.silent:true)&&!!silent};return}
  loadBusy=true;
  const keepScroll=silent?content.scrollTop:0;
  if(!silent)content.innerHTML='<div class="hint">Loading…</div>';
  try{
    if(state.view==='overview')await vOverview();
    else if(state.view==='flows')await vFlows();
    else if(state.view==='top')await vTop();
    else if(state.view==='countries')await vCountries();
    else if(state.view==='conv')await vConv();
    else if(state.view==='flowmap'){if(silent)await drawMap();else await vFlowmap()}
    else if(state.view==='geo')await vGeo();
    else if(state.view==='anomalies')await vAnomalies();
    else if(state.view==='exporters')await vExporters();
    else if(state.view==='labels')await vLabels();
    else if(state.view==='metrics')await vMetrics();
    state.updated=Date.now();state.lastErr=null;syncHash();
    if(silent)content.scrollTop=keepScroll;
    enhanceAsns();enhanceTopIps();
  }catch(e){
    if(silent){state.lastErr=e.message;toast('Refresh failed: '+e.message)}
    else content.innerHTML='<div class="err">Error: '+esc(e.message)+'</div>'
  }finally{
    loadBusy=false;
    if(loadNext){const n=loadNext;loadNext=null;load(n.silent)}
  }
}

// click-safe filter: value rides in data-k (esc handles HTML), JS reads it back
function topTbl(items, dim){
  const fk=DIM2F[dim]||dim;
  return `<table><tr><th></th><th>Key</th><th class="num">Bytes</th><th class="num">Flows</th></tr>${
    (items||[]).map((t,i)=>{
      const k=String(t.key);
      // IP-keyed rows show the endpoint's ASN in the rank column (rank is
      // implicit in ordering anyway); resolved lazily by enhanceTopIps().
      const rank=looksIp(k)?`<span class="muted" data-topip="${esc(k)}">·</span>`:`<span class="muted">${i+1}</span>`;
      return `<tr><td class="num">${rank}</td>
      <td class="clickable" data-k="${esc(t.key)}" onclick="setFilter('${fk}',this.dataset.k)">${dimLabel(dim,t.key)}</td>
      <td class="num">${fmtB(t.bytes)}</td><td class="num">${fmtN(t.flows)}</td></tr>`}).join('')
    ||'<tr><td colspan=4 class=muted>No data</td></tr>'}</table>`;
}
// Fill [data-topip] rank cells with the IP's ASN (via /api/v1/lookup,

const _topAsn={};
async function enhanceTopIps(){
  const cells=[...document.querySelectorAll('[data-topip]')].filter(e=>!e.dataset.done);
  if(!cells.length)return;
  const ips=[...new Set(cells.map(e=>e.dataset.topip))];

    let d=_ipCache[ip];
    if(d===undefined){try{d=await api('/api/v1/lookup?ip='+encodeURIComponent(ip));_ipCache[ip]=d}catch(e){_ipCache[ip]={error:1}}}
    const asn=((d.results||[]).map(r=>r.result||{}).find(m=>m.asn)||{}).asn;

  drawChart(ts.series||[]);bindChartHover();
}
function trangeLabel(){return state.range==='custom'?($('#fromin').value||'?')+' → '+($('#toin').value||'now'):state.range}

function drawChart(series){
  const c=$('#chart');if(!c||!series||!series.length){state.chartSeries=series;return}
  state.chartSeries=series;
  const metric=state.metric||'bytes';
  const dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const vals=series.map(s=>s[metric]||0);
  const max=Math.max(...vals,1);
  const n=series.length,padL=10,padR=14,padT=16,padB=24,iw=W-padL-padR,ih=H-padT-padB;
  const fmt=metric==='bytes'?fmtB:fmtN;
  // grid + y labels
  x.strokeStyle='#1d2534';x.fillStyle='#8b949e';x.font='10px ui-monospace,monospace';x.lineWidth=1;
  for(let i=0;i<=4;i++){const v=max*i/4,y=padT+ih*(1-i/4);
    x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();
    x.fillText(fmt(v),3,y+3);}
  // x labels
  const step=Math.ceil(n/8);
  series.forEach((s,i)=>{if(i%step)return;const d=new Date(s.t*1000);
    x.fillText(d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),padL+i*iw/Math.max(1,n-1)-16,H-8)});
  // points + catmull-rom → bezier smoothing
  const px=i=>padL+i*iw/Math.max(1,n-1), py=v=>padT+ih-(v/max)*ih;
  const pts=vals.map((v,i)=>[px(i),py(v)]);
  const path=()=>{x.beginPath();
    if(pts.length<3){pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));return}
    x.moveTo(pts[0][0],pts[0][1]);
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
      x.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);
    }};
  // gradient area fill
  const g=x.createLinearGradient(0,padT,0,H-padB);
  g.addColorStop(0,'rgba(59,130,246,.38)');g.addColorStop(.7,'rgba(59,130,246,.08)');g.addColorStop(1,'rgba(59,130,246,0)');
  path();x.lineTo(px(n-1),padT+ih);x.lineTo(px(0),padT+ih);x.closePath();x.fillStyle=g;x.fill();
  // gradient stroke line
  const lg=x.createLinearGradient(padL,0,W-padR,0);lg.addColorStop(0,'#3b82f6');lg.addColorStop(1,'#22d3ee');
  path();x.strokeStyle=lg;x.lineWidth=2;x.lineJoin='round';x.stroke();
  // peak marker
  const mi=vals.indexOf(max);
  x.fillStyle='#e6edf3';x.font='600 11px ui-monospace,monospace';
  x.fillText(fmt(max),px(mi)-14,padT+ih-8);
  // hover crosshair + tooltip
  const hi=state.hoverI;
  if(hi>=0&&hi<n){
    const s=series[hi],hx=px(hi),hy=py(vals[hi]);
    x.strokeStyle='rgba(230,237,243,.35)';x.setLineDash([4,4]);x.lineWidth=1;
    x.beginPath();x.moveTo(hx,padT);x.lineTo(hx,padT+ih);x.stroke();x.setLineDash([]);
    x.beginPath();x.arc(hx,hy,3.5,0,7);x.fillStyle='#22d3ee';x.fill();
    x.strokeStyle='#0b0e14';x.lineWidth=1.5;x.stroke();
    const lbl=`${fmt(vals[hi])} · ${new Date(s.t*1000).toLocaleTimeString()}`;
    x.font='11px ui-monospace,monospace';
    const tw=x.measureText(lbl).width+12;
    let bx=Math.min(Math.max(hx-tw/2,padL),W-padR-tw),by=padT+4;
    x.fillStyle='rgba(18,22,31,.95)';x.strokeStyle='#232b3a';
    if(x.roundRect){x.beginPath();x.roundRect(bx,by,tw,18,5);x.fill();x.stroke()}
    else{x.fillRect(bx,by,tw,18);x.strokeRect(bx,by,tw,18)}
    x.fillStyle='#e6edf3';x.fillText(lbl,bx+6,by+13);
  }
}
function bindChartHover(){
  const c=$('#chart');if(!c)return;
  c.onmousemove=e=>{const s=state.chartSeries;if(!s||!s.length)return;
    const r=c.getBoundingClientRect(),padL=10,padR=14,iw=r.width-padL-padR;
    const i=Math.round((e.clientX-r.left-padL)/iw*(s.length-1));
    i===state.hoverI||(state.hoverI=Math.max(0,Math.min(s.length-1,i)),drawChart(s));};
  c.onmouseleave=()=>{state.hoverI=-1;if(state.chartSeries)drawChart(state.chartSeries)};
}

const DIM2F={src_ip:'src',dst_ip:'dst',src_asn:'src_asn',dst_asn:'dst_asn',src_port:'sport',dst_port:'dport',proto:'proto',exporter:'exporter',src_country:'src_country',dst_country:'dst_country',label:'label',src_ipver:'src_ipver',dst_ipver:'dst_ipver',src_org:'src_org',dst_org:'dst_org',vlan:'vlan',ingress_if:'ingress_if',egress_if:'egress_if'};
function clickDim(by,key){const f=DIM2F[by];if(!f)return;F[f]=key;load()}
// raw key for filtering when formatted key is a display string
function clickDimRaw(by,keyRaw,fmtKey){const f=DIM2F[by];if(!f)return;
  // key_raw is a string (u128-safe); use fmtKey where semantics matter
  if(by==='src_ipver'||by==='dst_ipver'){F[f]=fmtKey==='IPv6'?'6':'4'}
  else if(by==='label'){F[f]=fmtKey} // label name preferred
  else if(by==='src_org'||by==='dst_org'){F[f]=keyRaw} // numeric org id as string — API parses u32
  else{F[f]=fmtKey}
  load()}

async function expAction(ip,action){
  try{await api(`/api/v1/exporters/${ip}/${action}`,{method:'POST'});toast(`${ip}: ${action} ok`);load(true)}
  catch(e){toast('action failed: '+e.message)}
}
async function expRename(ip,raw){
  const n=prompt(`Name for exporter ${raw}:`,expNames[raw]||'');
  if(n===null)return;
  try{await api(`/api/v1/exporters/${ip}/name`,{method:'POST',body:{name:n}});loadExpNames();load(true)}
  catch(e){toast('rename failed: '+e.message)}
}

    ctx2.clearRect(0,0,W,H);
    // Equirectangular with correct 2:1 world aspect — scale is degrees→px,
    // letterboxed inside the canvas so shapes aren't stretched.
    const sc=Math.min(W/360,H/180),ox=(W-360*sc)/2,oy=(H-180*sc)/2;
    const px=lon=>ox+(lon+180)*sc, py=lat=>oy+(90-lat)*sc;
    // world map land (normalized 0..1 path coords)
    try{
      const land=new Path2D(WORLD_PATH);
      ctx2.save();ctx2.translate(ox,oy);ctx2.scale(360*sc,180*sc);
      ctx2.fillStyle='rgba(110,130,165,0.13)';ctx2.fill(land,'evenodd');
      ctx2.strokeStyle='rgba(110,130,165,0.30)';ctx2.lineWidth=0.0011;ctx2.stroke(land);
      ctx2.restore();
    }catch(e){}
    // graticule
    ctx2.strokeStyle='var(--border,#333)';ctx2.lineWidth=1;ctx2.globalAlpha=0.5;
    for(let lo=-180;lo<=180;lo+=30){const x=px(lo);ctx2.beginPath();ctx2.moveTo(x,oy);ctx2.lineTo(x,oy+180*sc);ctx2.stroke()}
    for(let la=-60;la<=60;la+=30){const y=py(la);ctx2.beginPath();ctx2.moveTo(ox,y);ctx2.lineTo(ox+360*sc,y);ctx2.stroke()}
    ctx2.globalAlpha=1;
    const maxB=Math.max(1,...pts.map(p=>p.bytes||0));
    cv._pts=pts.map(p=>({...p,x:px(p.lon),y:py(p.lat),r:3+Math.sqrt((p.bytes||0)/maxB)*22}));
    for(const p of cv._pts){
      ctx2.beginPath();ctx2.arc(p.x,p.y,p.r,0,7);
      ctx2.fillStyle='rgba(79,140,255,.35)';ctx2.fill();
      ctx2.strokeStyle='rgba(79,140,255,.8)';ctx2.stroke();
    }
  };
  draw();window.addEventListener('resize',draw);
  cv.onmousemove=e=>{
    const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    let best=null,bd=18;
    for(const p of cv._pts||[]){const dd=Math.hypot(p.x-mx,p.y-my);if(dd<bd+p.r&&dd<bd+14){best=p;bd=dd}}
    const el=$('#geohint');
    if(best&&el)el.innerHTML=`<b>${esc(best.city||'unknown')}</b> ${best.lat.toFixed(2)},${best.lon.toFixed(2)} — ${fmtB(best.bytes)} · ${fmtN(best.flows)} flows`;
    else if(el)el.textContent='hover a bubble';
  };
  const rows=pts.slice(0,15).map(p=>`<tr><td>${p.city?esc(p.city):'<span class="muted">-</span>'}</td><td class="num">${p.lat.toFixed(2)}, ${p.lon.toFixed(2)}</td><td class="num">${fmtB(p.bytes)}</td><td class="num">${fmtN(p.flows)}</td></tr>`).join('');
  $('#getbl').innerHTML=`<table><tr><th>City</th><th>Coords</th><th class="num">Bytes</th><th class="num">Flows</th></tr>${rows||'<tr><td colspan=4 class=muted>No geo data in range (need city MMDB + recent flows)</td></tr>'}</table>`;
}

// ---------- flow detail drawer ----------
let _fl=[];
function flowDetail(i){
  const f=_fl[i];if(!f)return;
  let d=document.getElementById('fdetail');if(!d){d=document.createElement('div');d.id='fdetail';document.body.appendChild(d)}
  const kv=(k,v)=>`<tr><td class="muted">${k}</td><td>${v??'<span class="muted">-</span>'}</td></tr>`;
  const ip=(x,p,c,l,la,lo)=>`${x}:${p}${c?` <span class="muted">· ${esc(c)}${l?` @ ${Number(la).toFixed(2)},${Number(lo).toFixed(2)}`:''}</span>`:''}`;
  d.innerHTML=`<div class="fd-head"><b>Flow detail</b><span class="clickable" onclick="document.getElementById('fdetail').remove()">✕</span></div><table>
   ${kv('Time',f.ts?new Date(f.ts*1000).toLocaleString():'-')}
   ${kv('Source',ip(f.src_ip,f.src_port,f.src_city,f.src_ptr,f.src_lat,f.src_lon))}
   ${kv('Dest',ip(f.dst_ip,f.dst_port,f.dst_city,f.dst_ptr,f.dst_lat,f.dst_lon))}
   ${kv('Region',`${f.src_region||'-'} → ${f.dst_region||'-'}`)}
   ${kv('Proto',`${f.protocol_name||f.protocol} flags=0x${(f.tcp_flags||0).toString(16)}`)}
   ${kv('ASN',`AS${f.src_asn||'-'} → AS${f.dst_asn||'-'}`)}
   ${kv('Org',`${f.src_org||f.src_country||'-'} → ${f.dst_org||f.dst_country||'-'}`)}
   ${kv('Bytes/Pkts',`${fmtB(f.bytes)} / ${fmtN(f.packets)}`)}
   ${kv('Duration',f.duration_ms?f.duration_ms+' ms':'-')}
   ${kv('Ifaces',`${ifLabel(f.ingress_if)} → ${ifLabel(f.egress_if)}`)}
   ${kv('Next hop',f.next_hop!=='0.0.0.0'&&f.next_hop!=='::'?f.next_hop:'-')}
   ${kv('Exporter',f.exporter)}${kv('Engine',f.engine_id?`${f.engine_id}/${f.engine_type}`:'-')}
   ${kv('Sampler',f.sampler_interval>1?`1 in ${f.sampler_interval}`:'-')}
   ${kv('TCP state',f.tcp_state||'-')}${kv('TTL',f.ip_ttl||'-')}
   ${kv('End reason',f.flow_end_reason??'-')}${kv('VLAN',vlanLabel(f.vlan))}
   ${kv('Label',f.label||'-')}${kv('ICMP',f.icmp_type?`${f.icmp_type}/${f.icmp_code}`:'-')}
   ${f.post_nat_src||f.post_nat_dst?kv('Post-NAT',`${f.post_nat_src||'-'} → ${f.post_nat_dst||'-'}`):''}
  </table>`;
}

const MATRIX_DIMS=['src_ipver','dst_ipver','src_asn','dst_asn','src_org','dst_org','src_country','dst_country','proto','label','src_port','dst_port'];

async function vFlowmap(){
  content.innerHTML=`<div class="filters">
    ${presetBar()}
    <span class="muted">from</span>
    <select id="m_src">${MATRIX_DIMS.map(d=>`<option ${state.msrc===d?'selected':''}>${d}</option>`).join('')}</select>
    <span class="muted">→</span>
    <select id="m_dst">${MATRIX_DIMS.map(d=>`<option ${state.mdst===d?'selected':''}>${d}</option>`).join('')}</select>
    <select id="m_lim"><option>25</option><option>50</option><option selected>100</option><option>250</option><option>500</option></select>
    <select id="m_gran"><option value="minute" ${state.granularity==='minute'?'selected':''}>minute</option><option value="hourly" ${state.granularity==='hourly'?'selected':''}>hourly</option></select>
    <button class="btn" onclick="drawMap()">Draw</button></div>
   <div class="panel"><h3>Flow Map — <span id="m_lbl"></span> <span class="muted" style="text-transform:none">(hover a node to isolate its flows)</span></h3><canvas id="sankey" style="height:540px"></canvas></div>
   <div class="panel"><h3>Top Pairs</h3><div id="ptbl"></div></div>`;
  state.msrc=$('#m_src').value;state.mdst=$('#m_dst').value;state.mlim=+$('#m_lim').value;state.granularity=$('#m_gran').value;
  // changing any control redraws immediately — no need for the Draw button
  ['m_src','m_dst','m_lim','m_gran'].forEach(id=>{const el=$('#'+id);if(el)el.onchange=()=>{syncMapCtl();drawMap()}});
  bindSankeyHover();
  await drawMap();
}
function syncMapCtl(){
  const g=id=>$('#'+id)?.value;
  if(g('m_src'))state.msrc=g('m_src');
  if(g('m_dst'))state.mdst=g('m_dst');
  if(g('m_lim'))state.mlim=+g('m_lim');
  if(g('m_gran'))state.granularity=g('m_gran');
}
async function drawMap(){
  syncMapCtl();
  const data=await api('/api/v1/matrix?'+q({src_dim:state.msrc,dst_dim:state.mdst,limit:state.mlim}));
  if(!$('#sankey'))return; // navigated away mid-fetch
  state.mapData=data;state.mapHoverNode=null;
  $('#m_lbl').textContent=`${state.msrc} → ${state.mdst}`;
  drawSankey(data.items||[]);bindSankeyHover();
  const max=(data.items||[])[0]?.bytes||1;
  const rows=(data.items||[]).slice(0,25).map(p=>{
    // country filters need the 2-letter code, not the packed raw value
    const sv=state.msrc.includes('country')?p.src:String(p.src_raw??p.src);
    const dv=state.mdst.includes('country')?p.dst:String(p.dst_raw??p.dst);
    return `<tr>
    <td class="clickable" data-k="${esc(sv)}" data-dim="${state.msrc}" onclick="pairFilter(this)">${dimLabel(state.msrc,p.src)}</td>
    <td class="muted">→</td>
    <td class="clickable" data-k="${esc(dv)}" data-dim="${state.mdst}" onclick="pairFilter(this)">${dimLabel(state.mdst,p.dst)}</td>
    <td style="width:20%"><span class="bar" style="width:${Math.max(2,p.bytes/max*100)}%"></span></td>
    <td class="num">${fmtB(p.bytes)}</td><td class="num">${fmtN(p.flows)}</td></tr>`}).join('');
  $('#ptbl').innerHTML=`<table><tr><th>Source</th><th></th><th>Dest</th><th></th><th class="num">Bytes</th><th class="num">Flows</th></tr>${rows||'<tr><td colspan=6 class=muted>No data</td></tr>'}</table>`;
}
function pairFilter(el){F[el.dataset.dim]=el.dataset.k;load()}

// Sankey renderer: left nodes = src dim, right = dst dim, ribbons ∝ bytes.
function nodeColor(id){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return `hsl(${h%360},65%,55%)`}
const SANK_MAXN=40;
function drawSankey(items){
  const c=$('#sankey');if(!c)return;
  const dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  x.clearRect(0,0,W,H);
  state._sankey=null;
  if(!items||!items.length)return;
  // cap distinct nodes per side; overflow folds into "Other"
  const totals=(arr,f)=>{const o={};arr.forEach(p=>{const k=f(p);o[k]=(o[k]||0)+p.bytes});return o};
  const keepSet=(o)=>{const ks=Object.keys(o);if(ks.length<=SANK_MAXN)return null;
    return new Set(ks.sort((a,b)=>o[b]-o[a]).slice(0,SANK_MAXN))};
  const kL=keepSet(totals(items,p=>String(p.src))),kR=keepSet(totals(items,p=>String(p.dst)));
  // format_key emits JSON numbers for asn/port/org/label — normalize to strings
  const mk=(k,keep)=>{const ks=String(k);return keep?(keep.has(ks)?ks:'Other'):ks};
  const pm=new Map();
  items.forEach(p=>{
    const s=mk(p.src,kL),d=mk(p.dst,kR),key=s+' '+d;
    const e=pm.get(key)||{src:s,dst:d,bytes:0};e.bytes+=p.bytes;pm.set(key,e);
  });
  const pairs=[...pm.values()].sort((a,b)=>b.bytes-a.bytes);
  const L=totals(pairs,p=>p.src),R=totals(pairs,p=>p.dst);
  // vertical layout: node height ∝ bytes, stacked with small gaps
  const padT=14,padB=8,gap=2,nodeW=10;
  const sumL=Object.values(L).reduce((a,b)=>a+b,0),sumR=Object.values(R).reduce((a,b)=>a+b,0);
  const n=Math.max(Object.keys(L).length,Object.keys(R).length);
  const availH=Math.max(40,H-padT-padB-gap*Math.max(0,n-1));
  const scale=availH/Math.max(sumL,sumR,1);
  function layout(nodes){
    const keys=Object.keys(nodes).sort((a,b)=>nodes[b]-nodes[a]);
    const pos={};let y=padT;
    keys.forEach((k,i)=>{const h=Math.max(2.5,nodes[k]*scale);pos[k]={y0:y,y1:y+h};y+=h+(i<keys.length-1?gap:0)});
    return{keys,pos};
  }
  const layL=layout(L),layR=layout(R);
  // label columns sit beside the bars so text never crosses ribbons
  const lblW=W<640?80:115;
  const xBarL=10,xLabL=xBarL+nodeW+6,xRibL=xLabL+lblW+8;
  const xRBar=W-10-nodeW-lblW-6,xRibR=xRBar-5;
  const midX=(xRibL+xRibR)/2;
  if(xRibR<=xRibL+30){x.fillStyle='#8b949e';x.font='12px sans-serif';x.fillText('canvas too narrow',20,H/2);state._sankey=null;return}
  // ribbon spans: cumulative offsets inside each endpoint node
  const sOff={},dOff={};
  pairs.forEach(p=>{
    const sl=layL.pos[p.src],dl=layR.pos[p.dst];
    const w=p.bytes*scale;
    const so=sOff[p.src]||0,dd=dOff[p.dst]||0;
    sOff[p.src]=so+w;dOff[p.dst]=dd+w;
    p._r={s0:sl.y0+so,s1:sl.y0+so+w,d0:dl.y0+dd,d1:dl.y0+dd+w};
  });
  const hov=state.mapHoverNode;
  const hovSide=hov?hov.side:null,hovKey=hov?hov.key:null;
  const nodeLabel=(dim,k)=>{
    let s=k;
    if(dim.includes('country'))s=flag(k);
    else if(dim.includes('asn'))s='AS'+k;
    return String(s).slice(0,Math.max(8,Math.floor(lblW/6.5)));
  };
  // ribbons
  pairs.forEach(p=>{
    const r=p._r,connected=!hov||(hovSide==='L'?p.src===hovKey:p.dst===hovKey);
    x.beginPath();
    x.moveTo(xRibL,r.s0);
    x.bezierCurveTo(midX,r.s0,midX,r.d0,xRibR,r.d0);
    x.lineTo(xRibR,r.d1);
    x.bezierCurveTo(midX,r.d1,midX,r.s1,xRibL,r.s1);
    x.closePath();
    x.fillStyle=nodeColor(p.src);x.globalAlpha=connected?.38:.05;x.fill();x.globalAlpha=1;
  });
  // nodes: bar + accent edge + labels (only when tall enough)
  function drawSide(lay,nodes,side){
    const bx=side==='L'?xBarL:xRBar,dim=side==='L'?state.msrc:state.mdst;
    lay.keys.forEach(k=>{
      const nd=lay.pos[k],h=nd.y1-nd.y0,cy=nd.y0+h/2;
      const isHov=hovSide===side&&hovKey===k;
      x.fillStyle=isHov?'#3b82f6':'#1d2534';
      x.fillRect(bx,nd.y0,nodeW,h);
      x.fillStyle=nodeColor(k);x.globalAlpha=.9;
      x.fillRect(bx,nd.y0,2.5,h);x.globalAlpha=1;
      if(h<11)return;
      x.font='10px ui-monospace,monospace';
      x.fillStyle=isHov?'#fff':'#e6edf3';
      x.fillText(nodeLabel(dim,k),bx+nodeW+5,cy+3);
      if(h>=26){x.fillStyle='#8b949e';x.font='9px ui-monospace,monospace';x.fillText(fmtB(nodes[k]),bx+nodeW+5,cy+14)}
    });
  }
  drawSide(layL,L,'L');drawSide(layR,R,'R');
  state._sankey={layL,layR,L,R,pairs,xBarL,xRBar,nodeW,lblW,W,H};
}
function bindSankeyHover(){
  const c=$('#sankey');if(!c)return;
  c.onmousemove=e=>{
    const sk=state._sankey;if(!sk)return;
    const r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    let hit=null;
    for(const side of['L','R']){
      const lay=side==='L'?sk.layL:sk.layR,x0=side==='L'?sk.xBarL:sk.xRBar,x1=x0+sk.nodeW+sk.lblW+12;
      for(const k of lay.keys){
        const nd=lay.pos[k];
        if(mx>=x0-3&&mx<=Math.min(x1,sk.W-2)&&my>=nd.y0-1&&my<=nd.y1+1){hit={side,key:k};break}
      }
      if(hit)break;
    }
    const nn=hit||null;
    if(nn?.key!==state.mapHoverNode?.key||nn?.side!==state.mapHoverNode?.side){
      state.mapHoverNode=nn;if(state.mapData)drawSankey(state.mapData.items||[])
    }
  };
  c.onmouseleave=()=>{state.mapHoverNode=null;if(state.mapData)drawSankey(state.mapData.items||[])};
}

async function vMetrics(){
  const r=await fetch('/metrics',{signal:AbortSignal.timeout(API_TIMEOUT)});const t=await r.text();
  content.innerHTML=`<div class="panel"><h3>Prometheus Metrics</h3><pre>${esc(t)}</pre></div>`;
}

function fmtUp(s){if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h'}
function applyStatus(d){
  const el=$('#syschip');if(!el)return;
  const sy=d.system||{};
  if(!sy.ok){el.textContent='sys n/a';el.title='system stats unavailable on this platform';return}
  const cpu=sy.cpu_pct==null?'—':sy.cpu_pct.toFixed(0)+'%';
  const mem=sy.mem_pct==null?'—':sy.mem_pct.toFixed(0)+'%';
  const dsk=sy.disk_pct==null?'—':sy.disk_pct.toFixed(0)+'%';
  el.textContent=`CPU ${cpu} · MEM ${mem} · DSM ${dsk}`;
  const st=d.status||{};
  const stored=fmtB((st.flow_bytes||0)+(st.rollup_bytes||0)+(st.hourly_bytes||0));
  el.title=`cpu ${cpu} of ${sy.cpu_count||'?'} cores · load ${sy.load1?.toFixed(2)??'—'}/${sy.load5?.toFixed(2)??'—'}/${sy.load15?.toFixed(2)??'—'}\n`
    +`mem ${fmtB((sy.mem_used_mb||0)*1048576)} / ${fmtB((sy.mem_total_mb||0)*1048576)}\n`
    +`disk ${sy.disk_path||''}: ${sy.disk_avail_gb??'?'}G free of ${sy.disk_total_gb??'?'}G\n`
    +`bgflow stored: ${stored} (${st.flow_segments||0}f/${st.rollup_segments||0}r/${st.hourly_segments||0}h segs)`;
  const ver=$('#ver');if(ver&&d.version){ver.textContent=`${d.version} · up ${fmtUp(st.uptime_secs||0)}`;ver.title='git: '+(d.git||'')}
}
function refreshSys(){
  fetch('/api/v1/status',{signal:AbortSignal.timeout(8000)}).then(r=>r.json()).then(applyStatus).catch(()=>{});
}
// Live channel: SSE pushes the same status payload every 2s (one server-side
// computation shared by all clients). The 10s poll stays as fallback.
function startStream(){
  if(typeof EventSource==='undefined')return;
  try{
    const es=new EventSource('/api/v1/stream');
    es.addEventListener('status',e=>{try{applyStatus(JSON.parse(e.data))}catch(_){}});
  }catch(e){}
}
setInterval(refreshSys,10000);refreshSys();startStream();
probeAuth();
</script>
