name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        run: cargo build --release -p bgflowd --target ${{ matrix.target }}

      - name: package
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          [ -z "$VER" ] && VER="dev-$(git rev-parse --short HEAD)"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/bgflowd" dist/bgflowd
          tar -czf "bgflow-${VER}-${{ matrix.target }}.tar.gz" -C dist bgflowd
          ls -la *.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bgflow-${{ matrix.target }}
          path: bgflow-*.tar.gz

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bgflow-*
          merge-multiple: true

      - name: checksums
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            SHA256SUMS
          generate_release_notes: true
