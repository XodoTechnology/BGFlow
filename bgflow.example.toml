# BGFlow example configuration — copy to /etc/bgflow/bgflow.toml
# Docs: README.md | Install: INSTALL.md

[server]
# HTTP API + embedded UI listen address.
http_listen = "0.0.0.0:8080"
# --- Authentication ---------------------------------------------------------
# Two ways to protect the UI/API:
#
# 1) Multi-user (recommended): [[users]] entries with PBKDF2 password hashes
#    and roles (admin | viewer). Generate a hash with:
#        bgflowd hash-password        # prompts on stdin, prints the hash
#    Then:
#        [[users]]
#        name = "admin"
#        password_hash = "pbkdf2-sha256$600000$...."
#        role = "admin"
#    Viewers get read-only access to all data endpoints; admins additionally
#    get /api/v1/config, /api/v1/enrichers, and POST /api/v1/admin/reload.
#    The UI shows a login page; API clients can use the session cookie or
#    HTTP Basic auth with the same credentials.
#
# 2) Legacy single credential (everything = admin):
#    auth = "admin:change-me"
#
# auth = "admin:change-me"
#
# Session cookies: HttpOnly + SameSite=Strict (+ Secure when TLS is on).
# session_secret signs session tokens — leave unset for a random per-boot
# key (sessions die on restart, which is usually what you want); set a long
# random string to keep sessions across restarts.
# session_secret = "change-me-long-random"
# session_ttl_secs = 86400
# Max seconds a single segment scan may run before aborting (503).
# Keeps timed-out queries from burning CPU after the client disconnects.
# 0 disables the limit. Default 120.
# query_timeout_secs = 120
#
# Allow cross-origin API access (UI is same-origin; off by default).
# cors = true plus cors_origins restricts CORS to those origins (credentials
# allowed). cors = true with no origins = wide open (dev only!).
# cors = false
# cors_origins = ["https://flows.example.com"]
# TLS: serve HTTPS directly (both required; otherwise plain HTTP).
# Strongly recommended when auth is enabled — passwords and session
# cookies are plaintext over HTTP. tls_cert = "/etc/bgflow/tls.crt"
# tls_key  = "/etc/bgflow/tls.key"
# Version stamp shown in the UI footer + /api/v1/status. Empty = the
# compile-time git-derived string. Useful for distro packages or builds
# without .git. The BGFLOW_VERSION / BGFLOW_GIT_DESCRIBE environment
# variables override these (env wins over config).
# version = "v1.2.3-packaged"
# git_describe = "pkg/release@abc1234"

[storage]
# Data directory for .bfs segments + org string table.
data_dir = "/var/lib/bgflow"
# Flush a raw-flow segment after this many rows ...
segment_rows = 100000
# ... or after this many seconds.
segment_interval_secs = 60
# Ingest channel buffer (records). Increase for very high flow rates.
channel_capacity = 65536
# Retention: raw flows kept this long; rollups (1-min aggregates) longer.
raw_retention_days = 7
rollup_retention_days = 90
# How often retention sweeps run.
retention_interval_secs = 300
# Coarse rollup dataset: hourly buckets with /24·/48-masked IPs — low
# cardinality, kept for coarse_retention_days. Query it with
# granularity=hourly on /api/v1/top|summary|timeseries.
coarse_rollup = true
coarse_retention_days = 365
# Sampling correction: multiply rollup bytes/packets by each flow's
# sampler_interval (1-in-N). Enable ONLY if your exporters report raw
# sampled counts (most do); exporters that pre-scale would double-count.
sample_weighting = false
# Hard disk cap for all segment data (raw + rollups + hourly). When
# exceeded, the oldest segments are evicted first until usage drops
# under 90% of the cap. 0 = unlimited. Accepts "50GiB", "51200M", or bytes.
# max_bytes = "50GiB"
# Filesystem guard — protects the WHOLE disk, not just bgflow's share
# (max_bytes can't see other tenants filling the volume). When free
# space on a dataset's filesystem drops below the floor, that dataset
# evicts its own oldest segments until it recovers. Set percent of the
# filesystem, an absolute floor, or both — whichever demands more free
# space wins. 0 = off. Checked on the retention sweep interval.
# min_free_pct = 10          # keep 10% of the fs free
# min_free_bytes = "5GiB"    # ...or keep 5 GiB free
# Optional: put datasets on separate mounts — e.g. bulk raw flows on a
# big disk, rollup stats on a smaller fast one. Each defaults to
# <data_dir>/{flows,rollups,hourly,geo}.
# flows_dir = "/bulk/bgflow/flows"
# rollups_dir = "/stats/bgflow/rollups"
# hourly_dir = "/stats/bgflow/hourly"
# geo_dir = "/stats/bgflow/geo"
# Scheduled backups: every N seconds write a timestamped, CRC-verified
# copy of the data dir under backup_dir, keeping the newest backup_keep.
# 0 = disabled (the `bgflowd backup` CLI command still works ad-hoc).
# backup_interval_secs = 86400
# backup_keep = 3
# backup_dir = "/var/backups/bgflow"   # default: <data_dir>/backups

[geoip]
# GeoIP MMDB databases (optional) — fills in ASN/org/country for flows
# whose exporter didn't provide them. Point country_db at a *-city-*.mmdb
# to also get city/region/lat-lon per endpoint. Any MaxMind-compatible MMDB works:
#   * DB-IP Lite (free, no account): https://db-ip.com/db/download/
#   * MaxMind GeoLite2 (free account + license key): https://www.maxmind.com
#   * ip-database/mmdb mirror (GeoLite2 per-family, no key):
#     https://github.com/ip-database/mmdb
# Easiest: `bgflowd geoip-update` downloads DB-IP Lite (or --source github
# for per-family GeoLite2 files) and prints the config to use.
# Each setting takes one path or a list — list per-family files (separate
# IPv4/IPv6 databases) and lookups pick the right one automatically:
#   asn_db = ["/path/asn-ipv4.mmdb", "/path/asn-ipv6.mmdb"]
# Typical install: /usr/share/GeoIP/{GeoLite2-ASN,GeoLite2-Country}.mmdb
# Leave empty to disable MMDB enrichment.
asn_db = "/usr/share/GeoIP/GeoLite2-ASN.mmdb"
country_db = "/usr/share/GeoIP/GeoLite2-Country.mmdb"
# Optional auto-update: periodically download fresh databases and hot-swap
# readers (no restart). update_source = "dbip" (DB-IP Lite, no account) or
# "github" (per-family GeoLite2 mirror). Downloads go to update_dir —
# empty means the directory of the first db path above. update_secs is the
# interval (0 = weekly). Replaced .mmdb files are always picked up within
# ~60s even without auto-update.
# update_source = "github"
# update_secs = 604800
# update_dir = "/usr/share/GeoIP"

# Optional: per-exporter naming — the recommended scheme. Each line is
#   "<exporter-ip>|<name>|<ifindex>-<ifname>|<vlanid>-<vlanname>"
# where the name and pair fields may be left empty to skip them.
# ifIndex and VLAN ids are only meaningful on the exporting device, so
# the same id can map to different names on different exporters — there
# is never a global guess:
#   10.0.0.1|core-rtr-01|2-ae0|250-cogent
#   10.0.0.1||3-ae1|251-mercury
#   10.0.0.2|core-rtr-02|2-eth0|250-ixp1
# naming = [
#   "10.0.0.1|core-rtr-01|2-ae0|250-cogent",
#   "10.0.0.1||3-ae1|251-mercury",
#   "10.0.0.2|core-rtr-02|2-eth0|250-ixp1",
# ]
# Resolution order for display names: UI-set labels (Exporters view)
# > naming lines > SNMP-learned > the legacy global maps below.
naming = []

# Legacy global fallbacks — applied to EVERY exporter only when no
# exporter-scoped name exists. Avoid these when devices disagree on
# ifIndex/VLAN numbering; prefer `naming` above.
# [interface_names]
# "2" = "ae0"

# [vlan_names]
# "10" = "Devoli"
# "250" = "Cogent"

# Optional: your own ASNs — drives the inbound/outbound split on the
# dashboard traffic graph (dst_asn local = in, src_asn local = out).
# [analytics]
# local_asns = [64512, 65000]

# Optional: SNMP-poll approved/pending exporters for interface names
# (IF-MIB), VLAN names (Q-BRIDGE-MIB) and device info. Learned names
# only fill gaps — [interface_names]/[vlan_names] and UI-set per-exporter
# labels always win. SNMPv2c community auth.
# [snmp]
# enabled = true
# community = "public"
# port = 161
# interval_secs = 300
# timeout_secs = 2

# --- Flow inputs -------------------------------------------------------------
# One [[inputs]] block per listen socket. protocol = auto detects
# NetFlow v5/v9, IPFIX, and sFlow per datagram.

[[inputs]]
listen = "0.0.0.0:2055"
protocol = "auto"
# transport = "udp"        # udp | tcp | both  (tcp = IPFIX stream only)
# Optional exporter allowlist:
# allowed_exporters = ["10.0.0.1", "10.0.0.2"]
# UDP receive buffer bytes — raise for busy routers (OS default ~200KB
# drops bursts). 4-16MB recommended on real deployments:
# udp_buffer_bytes = 8388608
# Max concurrent TCP connections (tcp/both only; 0 = unlimited):
# max_connections = 1024

# IPFIX over TCP example:
# [[inputs]]
# listen = "0.0.0.0:4739"
# protocol = "ipfix"
# transport = "tcp"

# [[inputs]]
# listen = "0.0.0.0:6343"
# protocol = "sflow"

# --- Flow export -------------------------------------------------------------
# Re-encode stored flows and forward them to other collectors over UDP.
# Only flows that were actually stored are exported; export is
# best-effort — a slow/lossy link drops datagrams (see bgflow_export_*
# metrics), it never affects ingestion or storage.
#
# [[export]]
# address = "10.0.0.5:2055"        # UDP destination (v4 or v6)
# protocol = "netflow9"            # netflow9 (default) | ipfix
# name = "upstream-collector"      # optional label for logs/status
# max_datagram = 1400              # UDP payload cap per datagram
# template_refresh_secs = 3600     # re-send templates this often; lower
                                  # values speed collector recovery

# --- HTTP enrichment backends ------------------------------------------------
# Query external whois/RDAP/IRR services for prefixes/IPs not covered by MMDB.
# Results are cached per prefix (IPv4 /24, IPv6 /48) and applied to later flows.
#
# {ip}     -> the flow's IP address
# {prefix} -> cache prefix, e.g. 1.2.3.0/24 or 2001:db8::/48
#
# Field mapping uses JSON dot-paths into the response.

[[enrichers]]
type = "http"
name = "irrd3"
url = "https://irrd3.net/api/lookup?ip={ip}"
timeout_ms = 2000
cache_ttl_secs = 86400
[enrichers.fields]
asn = "$.asn"
org = "$.org"
country = "$.country"
# Extra fields are lookup-time only (returned by /api/v1/lookup?ip=,
# not stored on flow records — FlowRecord has fixed columns).
# handle = "$.handle"
# irr_as_set = "$.as_set"
# Optional auth/API-key headers for private backends:
# [enrichers.headers]
# Authorization = "Bearer your-token"

# [[enrichers]]
# type = "http"
# name = "local-rdap"
# url = "http://rdap.internal.example/lookup/{ip}"
# timeout_ms = 1000
# cache_ttl_secs = 43200
# [enrichers.fields]
# asn = "$.asn"
# org = "$.name"
# country = "$.country"

# --- Table enricher: bulk prefix -> ASN/org/country --------------------------
# Loads a prefix table (local file or URL) and does exact longest-prefix-match
# lookups synchronously — no per-IP HTTP calls, ideal for BGP/IRR-scale data.
# Line format (whitespace separated, '#' comments):
#   1.2.3.0/24 13335 "Acme Corp" US
#   2001:db8::/32 AS64496 Acme GB
#   route: 10.0.0.0/8 origin: AS64512   (RPSL-ish, best effort)
# asn may be digits or AS-prefixed; country = 2-letter code; rest = org name.
# [[enrichers]]
# type = "table"
# name = "bgp-ribs"
# path = "/var/lib/bgflow/prefixes.txt"   # or https://example.com/dump.txt
# refresh_secs = 3600                     # re-read interval (min 60)

# --- Label rules -------------------------------------------------------------
# First matching rule wins; label_id is stored on the flow and shown in the UI.
# All specified fields must match (AND). Omit a field to wildcard it.
#
# Match fields: proto, port (either side), src_port, dst_port, src_ip, dst_ip (CIDR),
# src_asn, dst_asn, src_country, dst_country (alpha-2), exporter, org (substring).
# Unknown keys are rejected — a typo'd field fails config load rather than
# silently matching everything.

[[rules]]
name = "google"
dst_asn = 15169
dst_port = 443

[[rules]]
name = "cloudflare"
dst_asn = 13335

[[rules]]
name = "dns"
port = 53

# [[rules]]
# name = "internal"
# src_ip = "10.0.0.0/8"
# dst_ip = "10.0.0.0/8"

# [[rules]]
# name = "backup-window"
# dst_port = 873          # rsync
# exporter = "10.0.0.1"

# --- Threshold alerts ---------------------------------------------------------
# Evaluated every eval_secs over the rollup datasets. metric: bytes|packets|
# flows|pps|mbps (per-second rate over window_secs). op: gt|gte|lt|lte.
# group_by: any /top dimension (src_ip, src_asn, dst_country, label, ...).
# granularity: minute (default) | hourly. Fires -> log + metric + webhook_url.
# [alerts]
# eval_secs = 60
# cooldown_secs = 900        # min seconds between repeat fires per group
# webhook_url = "https://alerts.example.com/hook"
# [[alerts.rules]]
# name = "dns-flood"
# metric = "mbps"
# op = "gt"
# threshold = 500
# window_secs = 300
# group_by = "dst_port"
# proto = 17
# [[alerts.rules]]
# name = "new-country-spike"
# metric = "bytes"
# op = "gt"
# threshold = 100000000    # >100MB/s
# window_secs = 600
# group_by = "src_country"
# min_change_pct = 200     # only fire on >2x jump vs previous window

# --- Exporter names -------------------------------------------------------------
# Friendly names shown in the UI/API instead of bare exporter IPs.
# Filters accept either the IP or the name.
# [exporter_names]
# "10.0.0.1" = "edge-rtr-1"
# "10.0.0.2" = "core-rtr"

# --- Exporter admission control ----------------------------------------------
# When require_approval = true, any exporter IP not seen before starts as
# "pending": its datagrams are dropped (and counted) until an admin
# approves it — via the Exporters view buttons or
#   POST /api/v1/exporters/<ip>/approve        (also: suspend|reject|remove)
# Suspended/rejected exporters are always dropped. Decisions persist in
# <data_dir>/exporters.json. "trusted" IPs bypass approval entirely.
# [exporters]
# require_approval = true
# trusted = ["10.0.0.1", "192.168.1.1"]

# [[users]]
# name = "admin"
# password_hash = "pbkdf2-sha256$600000$<salt_b64>$<hash_b64>"
# role = "admin"          # admin | viewer (viewer = read-only)
#
# [[users]]
# name = "noc-viewer"
# password_hash = "pbkdf2-sha256$600000$<salt_b64>$<hash_b64>"
# role = "viewer"
#
# API keys for scripts/monitoring: send as `Authorization: Bearer <key>`
# or `X-Api-Key: <key>`. Keys inherit the user's role — an admin key is
# full admin. Plaintext is hashed (SHA-256) at load; `sha256:<hex>`
# stores a pre-computed digest instead (key itself never hits disk).
# Generate: openssl rand -hex 32
# api_keys = ["<64-hex-chars>"]

# --- Demo traffic -------------------------------------------------------------
# Send synthetic NetFlow v5 + IPFIX(IPv6) to the first input — handy for
# trying the UI. Traffic is spread across loopback exporter IPs
# (127.0.0.1..N) so the exporter dimension has multiple values.
# (Or use: bgflowd --demo 127.0.0.1:2055)
# [demo]
# enabled = true
# pps = 20
# flows_per_pkt = 20
# exporters = 3           # loopback source IPs: 127.0.0.1 .. 127.0.0.N
# duration_secs = 0       # 0 = forever
