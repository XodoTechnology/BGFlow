# --- Demo traffic -------------------------------------------------------------
# Send synthetic NetFlow v5 to the first input — handy for trying the UI.
# (Or use: bgflowd --demo 127.0.0.1:2055)
# [demo]
# enabled = true
# pps = 20
# flows_per_pkt = 20
# duration_secs = 0       # 0 = forever
